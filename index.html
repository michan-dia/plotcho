function setSelectMode(on){
  selectMode=on; $('#selBtn').setAttribute('aria-pressed',String(on)); board.classList.toggle('selecting',on);
  if(!on) clearSel(); else { document.activeElement?.blur?.(); renderSelBar(); }
}
function clearSel(){ selected.clear(); lastSel=null; board.querySelectorAll('.card.selected').forEach(e=>e.classList.remove('selected')); renderSelBar(); }
function toggleSel(id,range){
  if(range&&lastSel&&lastSel!==id){
    const ids=flatIds(); let a=ids.indexOf(lastSel), b=ids.indexOf(id); if(a>b) [a,b]=[b,a];
    ids.slice(a,b+1).forEach(x=>selected.add(x));
  }else if(selected.has(id)) selected.delete(id); else selected.add(id);
  lastSel=id;
  board.querySelectorAll('.card').forEach(e=>e.classList.toggle('selected',selected.has(e.dataset.id)));
  renderSelBar();
}
function pruneSel(){ const ids=new Set(flatIds()); for(const id of [...selected]) if(!ids.has(id)) selected.delete(id); }
function takeSelected(){
  const out=[]; const order=flatIds().filter(id=>selected.has(id));
  P().sections.forEach(s=>s.scenes.forEach(n=>{ n.cards=n.cards.filter(c=>{ if(selected.has(c.id)){ out.push(c); return false; } return true; }); }));
  return order.map(id=>out.find(c=>c.id===id)).filter(Boolean);
}
function withUndo(msg,fn){
  const snap=clone(P().sections); fn(); touch(); renderBoard(); updateStats();
  lastUndo=()=>{ P().sections=normalize({...P(),sections:clone(snap)}).sections; touch(); renderBoard(); updateStats(); };
  toast(msg,{label:'元に戻す',fn:()=>lastUndo&&lastUndo()});
}
function moveSelTo(sec,scene){
  const n=selected.size;
  withUndo(`${n}枚を「${sec.title||'区切り'}${scene.title?' › '+scene.title:''}」へ移動しました`,()=>{ const cards=takeSelected(); scene.cards.push(...cards); scene.collapsed=false; });
  requestAnimationFrame(()=>board.querySelector(`.card[data-id="${[...selected][0]}"]`)?.scrollIntoView({block:'nearest',inline:'center',behavior:REDUCED?'auto':'smooth'}));
}
function selToNewScene(){
  const first=flatIds().find(id=>selected.has(id)); const f=findCard(first); if(!f.sec) return;
  const n=newScene();
  withUndo(`${selected.size}枚を新しいシーンにまとめました`,()=>{ const cards=takeSelected(); const at=f.sec.scenes.indexOf(f.scene);
    if(f.sec.scenes.length===1&&!f.scene.title&&!f.scene.cards.length){ f.sec.scenes=[]; }
    f.sec.scenes.splice(Math.min(at+1,f.sec.scenes.length),0,n); n.cards.push(...cards); });
  requestAnimationFrame(()=>{ const t=board.querySelector(`.scene[data-id="${n.id}"] .scene-title`); if(t){ t.focus(); t.scrollIntoView({block:'nearest',inline:'center'}); } });
}
function deleteSel(){
  const n=selected.size;
  withUndo(`${n}枚のカードを削除しました`,()=>{ takeSelected(); P().sections.forEach(s=>{ if(!s.scenes.length) s.scenes.push(newScene()); }); });
  clearSel();
}
let selbarEl=null;
function renderSelBar(){
  const show=selected.size>0||selectMode;
  document.body.classList.toggle('has-selbar',show);
  if(!show){ selbarEl?.remove(); selbarEl=null; return; }
  if(!selbarEl){ selbarEl=h('div',{class:'selbar',role:'toolbar','aria-label':'選択したカード'}); document.body.append(selbarEl); }
  const n=selected.size;
  selbarEl.replaceChildren(
    h('b',null,n?`${n}枚選択中`:'カードを押して選択'),
    n?h('button',{id:'selMove',onclick:e=>destMenu(e.currentTarget)},'移動…'):null,
    n?h('button',{onclick:selToNewScene},'新しいシーンに'):null,
    n?h('button',{class:'danger',onclick:deleteSel},'削除'):null,
    h('button',{class:'x','aria-label':'選択をやめる',title:'選択をやめる',onclick:()=>setSelectMode(false)},'×'));
}
function destMenu(anchor){
  popover(anchor,close=>[h('div',{class:'label'},'移動先(いちばん下に入ります)'),h('div',{class:'dest'},
    ...P().sections.flatMap(s=>[
      h('div',{class:'sec-l',style:`--hue:var(--${s.hue})`},s.title||'（名前なし）'),
      ...s.scenes.map((n,j)=>h('button',{class:'item',onclick:()=>{ close(); moveSelTo(s,n); }},n.title||(s.scenes.length>1?`シーン${j+1}`:'（この区切り）')))
    ]))]);
  // 画面の下にあるボタンなので、メニューは上に開く
  if(popEl){ const r=anchor.getBoundingClientRect(); popEl.style.position='fixed'; popEl.style.top=Math.max(8,r.top-popEl.offsetHeight-8)+'px'; popEl.style.left=Math.max(8,Math.min(r.left,innerWidth-popEl.offsetWidth-8))+'px'; }
}
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&(selected.size||selectMode)&&!isEditing()&&!popEl&&!document.querySelector('.scrim')) setSelectMode(false); });
function syncFromDom(){
  const p=P(); const cards={}, scenes={}, secs={};
  p.sections.forEach(s=>{ secs[s.id]=s; s.scenes.forEach(n=>{ scenes[n.id]=n; n.cards.forEach(c=>cards[c.id]=c); }); });
  p.inbox.forEach(c=>cards[c.id]=c);
  const inboxEl=document.getElementById('inboxList');
  p.sections=[...board.querySelectorAll('.sec')].map(el=>{
    const s=secs[el.dataset.id];
    s.scenes=[...el.querySelectorAll('.scene')].map(ne=>{
      const n=scenes[ne.dataset.id]; if(!n) return null;
      n.cards=[...ne.querySelectorAll('.card')].map(c=>cards[c.dataset.id]).filter(Boolean);
      return n;
    }).filter(Boolean);
    if(!s.scenes.length) s.scenes.push(newScene());
    return s;
  }).filter(Boolean);
  if(inboxEl&&!side.hidden) p.inbox=[...inboxEl.querySelectorAll('.card')].map(c=>cards[c.dataset.id]).filter(Boolean);
  touch();
  setTimeout(afterDrop,0);
}
// 置いたあとは、変わったところ(枚数・空のシーン・ネタ帳から来たカード)だけ直す。
// シーンの枠の出し方が変わるときだけ、アニメーションが終わってから作り直す
function afterDrop(){
  const p=P(); let rebuild=false;
  board.querySelectorAll('.sec').forEach(se=>{
    const s=p.sections.find(x=>x.id===se.dataset.id); if(!s){ rebuild=true; return; }
    if(se.querySelectorAll('.scene').length!==s.scenes.length) rebuild=true;
    s.scenes.forEach(n=>{
      const ne=se.querySelector(`.scene[data-id="${n.id}"]`); if(!ne){ rebuild=true; return; }
      if((s.scenes.length>1||!!n.title)!==ne.classList.contains('framed')) rebuild=true;
      const cnt=ne.querySelector('.scene-count'); if(cnt) cnt.textContent=n.cards.length+'枚';
      const ph=ne.querySelector('.cards > .empty-cards');
      if(n.cards.length&&ph) ph.remove();
      if(!n.cards.length&&!ph) rebuild=true;
    });
  });
  board.querySelectorAll('.card.idea').forEach(el=>{ const f=findCard(el.dataset.id); if(f.card) el.replaceWith(cardEl(f.card)); });
  updateStats(); renderBudget(); renderTemp(); renderSide();
  if(rebuild) setTimeout(()=>{ if(!board.classList.contains('dragging')) renderBoard(); },260); // 見出しの出し分けや「◯枚」を更新
}
function findCard(id){
  for(const s of P().sections) for(const n of s.scenes){ const i=n.cards.findIndex(c=>c.id===id); if(i>=0) return {sec:s,scene:n,idx:i,card:n.cards[i]}; }
  return {};
}
function findScene(id){
  for(const s of P().sections){ const i=s.scenes.findIndex(n=>n.id===id); if(i>=0) return {sec:s,idx:i,scene:s.scenes[i]}; }
  return {};
}
const secOf=el=>P().sections.find(s=>s.id===el.closest('.sec')?.dataset.id);
const sceneOf=el=>findScene(el.closest('.scene')?.dataset.id).scene;
const lastScene=s=>{ if(!s.scenes.length) s.scenes.push(newScene()); return s.scenes[s.scenes.length-1]; };
function guessSpeaker(sec,idx,type){
  if(type!=='serif'&&type!=='mono') return '';
  const chars=P().chars; if(!chars.length) return '';
  let prev=null; for(let i=idx-1;i>=0;i--){ const c=sec.cards[i]; if((c.type==='serif'||c.type==='mono')&&c.speaker){ prev=c; break; } }
  if(!prev) return chars[0].id;
  if(type==='serif'&&prev.type==='serif'&&chars.length>=2){
    const j=chars.findIndex(c=>c.id===prev.speaker);
    return j===0?chars[1].id:chars[0].id;
  }
  return prev.speaker;
}
function addCard(scene,type,at=scene.cards.length,base,text=''){
  const c=base?{...clone(base),id:rid('k')}:{id:rid('k'),type,speaker:guessSpeaker(scene,at,type),text};
  scene.collapsed=false;
  scene.cards.splice(at,0,c); touch(); renderBoard(); updateStats();
  requestAnimationFrame(()=>{ const el=board.querySelector(`.card[data-id="${c.id}"]`); if(el){ startEdit(el); el.scrollIntoView({block:'nearest',inline:'nearest'}); } });
}
function addSection(at=P().sections.length){
  const p=P(); const used=new Set(p.sections.map(s=>s.hue));
  const hue=(HUES.find(x=>!used.has(x[0]))||HUES[5])[0];
  const s={id:rid('s'),title:'新しい区切り',hue,pages:0,scenes:[newScene()]};
  p.sections.splice(at,0,s); touch(); renderBoard(); updateStats();
  requestAnimationFrame(()=>{ const t=board.querySelector(`.sec[data-id="${s.id}"] .sec-title`); if(t){ t.focus(); t.select(); t.scrollIntoView({block:'nearest',inline:'nearest'}); } });
}
function addScene(sec,at=sec.scenes.length){
  const n=newScene(); sec.scenes.splice(at,0,n); touch(); renderBoard();
  requestAnimationFrame(()=>{ const t=board.querySelector(`.scene[data-id="${n.id}"] .scene-title`); if(t){ t.focus(); t.scrollIntoView({block:'nearest',inline:'nearest'}); } });
}
function removeScene(sec,scene){
  const i=sec.scenes.indexOf(scene); if(i<0) return;
  sec.scenes.splice(i,1); if(!sec.scenes.length) sec.scenes.push(newScene());
  touch(); renderBoard(); updateStats();
  lastUndo=()=>{ const s=P().sections.find(x=>x.id===sec.id)||P().sections[0]; if(!s) return;
    if(s.scenes.length===1&&!s.scenes[0].title&&!s.scenes[0].cards.length) s.scenes=[];
    s.scenes.splice(Math.min(i,s.scenes.length),0,scene); touch(); renderBoard(); updateStats(); };
  toast(`シーン「${scene.title||'名前なし'}」を削除しました`,{label:'元に戻す',fn:()=>lastUndo&&lastUndo()});
}
function sceneMenu(anchor,sec,scene){
  const p=P(); const i=sec.scenes.indexOf(scene); const si=p.sections.indexOf(sec);
  const move=(to,at)=>{ sec.scenes.splice(sec.scenes.indexOf(scene),1); if(!sec.scenes.length) sec.scenes.push(newScene());
    if(to.scenes.length===1&&!to.scenes[0].title&&!to.scenes[0].cards.length) to.scenes=[];
    to.scenes.splice(at==null?to.scenes.length:at,0,scene); touch(); renderBoard(); updateStats(); };
  popover(anchor,close=>[
    h('div',{class:'label'},'カードを追加'),
    h('div',{class:'chips'},...TYPES.map(([k,l])=>h('button',{class:'chip',onclick:()=>{ close(); addCard(scene,k); }},l))),
    h('hr'),
    h('button',{class:'item',onclick:()=>{ close(); scene.collapsed=!scene.collapsed; touch(); renderBoard(); }},scene.collapsed?'シーンを開く':'シーンをたたむ'),
    h('button',{class:'item',onclick:()=>{ close(); addScene(sec,i+1); }},'下にシーンを追加'),
    scene.temp!=null?h('button',{class:'item',onclick:()=>{ close(); scene.temp=null; touch(); renderTemp(); }},'グラフの点を消す'):null,
    i>0?h('button',{class:'item',onclick:()=>{ close(); move(sec,i-1); }},'ひとつ上へ移動'):null,
    i<sec.scenes.length-1?h('button',{class:'item',onclick:()=>{ close(); move(sec,i+1); }},'ひとつ下へ移動'):null,
    si>0?h('button',{class:'item',onclick:()=>{ close(); move(p.sections[si-1]); }},`前の区切り「${p.sections[si-1].title||'名前なし'}」へ`):null,
    si<p.sections.length-1?h('button',{class:'item',onclick:()=>{ close(); move(p.sections[si+1],0); }},`次の区切り「${p.sections[si+1].title||'名前なし'}」へ`):null,
    h('hr'),
    h('button',{class:'item danger',onclick:()=>{ close(); removeScene(sec,scene); }},'このシーンを削除')
  ]);
}
board.addEventListener('input',e=>{
  const t=e.target;
  if(t.matches('.scene-title')){ const n=sceneOf(t); if(n){ n.title=t.value; touch(); tempSoon(); } return; }
  if(t.matches('.card textarea')){ const {card}=findCard(t.closest('.card').dataset.id); if(!card) return; card.text=t.value; autosize(t); touch(); if(card.fs) sideSoon(); }
  else if(t.matches('.sec-title')){ secOf(t).title=t.value; touch(); sideSoon(); tempSoon(); }
  else if(t.matches('.sec-pages input')){ secOf(t).pages=Math.max(0,Math.round(Number(t.value)||0)); touch(); updateStats(); }
});
board.addEventListener('mousedown',e=>{ if(e.target.closest('.card-tools')||(e.shiftKey&&e.target.closest('.card'))) e.preventDefault(); });
board.addEventListener('focusout',e=>{
  if(e.target.matches('.card textarea')){ const el=e.target.closest('.card'); setTimeout(()=>{ if(!el.contains(document.activeElement)) endEdit(el); },0); }
});
board.addEventListener('keydown',e=>{
  const t=e.target;
  // Enterを2回（空行を入れる）と、そこで区切って次のカードへ。変換中のEnterは対象外
  if(e.key==='Enter'&&!e.shiftKey&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&!e.isComposing&&e.keyCode!==229&&t.matches('.card textarea')
     &&t.selectionStart===t.selectionEnd&&t.selectionStart>0&&t.value[t.selectionStart-1]==='\n'){
    e.preventDefault();
    const {scene,idx,card}=findCard(t.closest('.card').dataset.id); if(!card) return;
    const pos=t.selectionStart, before=t.value.slice(0,pos-1).replace(/\s+$/,''), rest=t.value.slice(pos).replace(/^\s+/,'');
    if(!before){ t.value=rest; card.text=rest; autosize(t); touch(); return; }
    card.text=before; touch();
    addCard(scene,card.type,idx+1,null,rest);
    return;
  }
  if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)&&e.target.matches('.card textarea')){
    e.preventDefault(); const {scene,idx,card}=findCard(e.target.closest('.card').dataset.id);
    if(scene) addCard(scene,card.type,idx+1);
  }else if(e.key==='Escape'&&e.target.matches('.card textarea')){ e.target.blur(); }
  else if((e.key==='Enter'||e.key===' ')&&e.target.matches('.bubble')){ e.preventDefault(); if(selectMode) toggleSel(e.target.closest('.card').dataset.id,false); else startEdit(e.target.closest('.card')); }
  else if(e.key==='Enter'&&e.target.matches('.scene-title')){ e.preventDefault(); e.target.blur(); }
});
$('#selBtn').addEventListener('click',()=>setSelectMode(!selectMode));
board.addEventListener('click',e=>{
  if(Date.now()-dragEndAt<300) return;
  const cardHit=e.target.closest('.card');
  if(cardHit&&!e.target.closest('.card-tools,.fs-tag,textarea')&&(selectMode||e.ctrlKey||e.metaKey||e.shiftKey)){
    e.preventDefault(); if(!selectMode&&!selected.size) document.activeElement?.blur?.();
    toggleSel(cardHit.dataset.id,e.shiftKey); return;
  }
  if(cardHit) lastSel=cardHit.dataset.id; // 普通にクリックしたカードを、Shift+クリックの起点にする
  const b=e.target.closest('[data-act]'); if(!b) return;
  const act=b.dataset.act;
  if(act==='edit') return startEdit(b.closest('.card'));
  if(act==='addsec') return addSection();
  if(act==='add') return addCard(lastScene(secOf(b)),b.dataset.type);
  if(act==='addscene') return addScene(secOf(b));
  if(act==='secmenu') return secMenu(b,secOf(b));
  if(act==='sadd') return addCard(sceneOf(b),'serif');
  if(act==='fold'){ const n=sceneOf(b); n.collapsed=!n.collapsed; touch(); renderBoard(); return; }
  if(act==='scenemenu') return sceneMenu(b,secOf(b),sceneOf(b));
  const {scene,idx,card}=findCard(b.closest('.card')?.dataset.id);
  if(!card) return;
  if(act==='ins') addCard(scene,card.type,idx+1);
  else if(act==='meta') metaMenu(b,card);
  else if(act==='cmenu') cardMenu(b,scene,idx,card);
  else if(act==='fs') fsMenu(b,card);
  else if(act==='del') removeCard(scene,idx,card);
});
function removeCard(scene,idx,card){
  scene.cards.splice(idx,1); touch(); renderBoard(); updateStats();
  lastUndo=()=>{ const n=findScene(scene.id).scene||lastScene(P().sections[0]); if(!n) return; n.cards.splice(Math.min(idx,n.cards.length),0,card); touch(); renderBoard(); updateStats(); };
  toast('カードを削除しました',{label:'元に戻す',fn:()=>lastUndo&&lastUndo()});
}
function secMenu(anchor,s){
  const p=P(); const idx=p.sections.indexOf(s);
  popover(anchor,close=>[
    h('div',{class:'label'},'色'),
    h('div',{class:'row'},...HUES.map(([k,l])=>h('button',{class:'sw','aria-label':l,'aria-pressed':String(s.hue===k),style:`background:var(--${k})`,onclick:()=>{ s.hue=k; touch(); close(); renderBoard(); }}))),
    h('hr'),
    h('button',{class:'item',onclick:()=>{ close(); addScene(s); }},'シーンを追加'),
    h('button',{class:'item',onclick:()=>{ close(); openBulk(s.id); }},'まとめて入力'),
    idx>0?h('button',{class:'item',onclick:()=>{ close(); p.sections.splice(idx,1); p.sections.splice(idx-1,0,s); touch(); renderBoard(); }},'ひとつ前へ移動'):null,
    idx<p.sections.length-1?h('button',{class:'item',onclick:()=>{ close(); p.sections.splice(idx,1); p.sections.splice(idx+1,0,s); touch(); renderBoard(); }},'ひとつ後ろへ移動'):null,
    h('button',{class:'item',onclick:()=>{ close(); addSection(idx+1); }},'うしろに区切りを追加'),
    h('button',{class:'item',onclick:()=>{ close(); addSection(idx); }},'まえに区切りを追加'),
    s.scenes.some(n=>n.temp!=null)?h('button',{class:'item',onclick:()=>{ close(); s.scenes.forEach(n=>n.temp=null); touch(); renderTemp(); }},'この区切りのグラフの点を消す'):null,
    h('hr'),
    h('button',{class:'item danger',onclick:()=>{
      close(); p.sections.splice(idx,1); touch(); renderBoard(); updateStats();
      lastUndo=()=>{ P().sections.splice(Math.min(idx,P().sections.length),0,s); touch(); renderBoard(); updateStats(); };
      toast(`「${s.title||'区切り'}」を削除しました`,{label:'元に戻す',fn:()=>lastUndo&&lastUndo()});
    }},'この区切りを削除')
  ]);
}

/* ---------- characters ---------- */
const charsEl=$('#chars');
let charSortable=null;
const imgSrc=im=>im.a?'/_blob/'+im.a:im.d;
function charEl(c){
  const main=c.images[0];
  const fld=(k,l)=>h('label',{class:'fld'},h('span',null,l),h('input',{'data-f':k,value:c[k]}));
  const lfd=(k,l)=>h('label',{class:'fld'},h('span',null,l),h('textarea',{'data-f':k,rows:2,value:c[k]}));
  return h('article',{class:'char',dataset:{id:c.id},style:`--cc:var(--${c.color})`},
    h('div',{class:'char-img'},
      h('button',{class:'main-img'+(main?' has':''),'data-act':main?'view':'addimg','aria-label':main?'画像を大きく表示':'画像を追加'},
        main?h('img',{src:imgSrc(main),alt:(c.name||'キャラ')+'の画像'}):h('span',null,'＋ 画像を追加',h('br'),'（ドロップでも可）')),
      h('div',{class:'thumbs'},
        ...c.images.map((im,i)=>h('button',{class:'thumb'+(i===0?' on':''),'data-act':'view','data-i':i,'aria-label':`画像${i+1}を表示`},h('img',{src:imgSrc(im),alt:''}))),
        c.images.length?h('button',{class:'thumb add','data-act':'addimg','aria-label':'画像を追加'},'＋'):null)),
    h('div',{class:'char-body'},
      h('div',{class:'char-top'},
        h('button',{class:'grip char-grip','aria-label':'キャラを並べ替え',title:'ドラッグで並べ替え'},'⋮⋮'),
        h('input',{class:'char-name','data-f':'name',value:c.name,placeholder:'名前','aria-label':'名前'}),
        h('div',{class:'swatches',role:'group','aria-label':'キャラの色'},...KCOL.map(k=>h('button',{class:'sw','data-act':'color','data-c':k,'aria-label':'色を変更','aria-pressed':String(c.color===k),style:`background:var(--${k})`}))),
        h('button',{class:'mini del','data-act':'delchar','aria-label':'キャラを削除',title:'キャラを削除',style:'opacity:1'},'×')),
      h('div',{class:'fgrid'},...FIELDS.map(([k,l])=>fld(k,l))),
      ...LONG.map(([k,l])=>lfd(k,l))));
}
function renderChars(){
  const p=P();
  charSortable?.destroy(); charSortable=null;
  charsEl.replaceChildren(...p.chars.map(charEl), h('button',{class:'add-char','data-act':'addchar'},'＋ キャラを追加'));
  if(window.Sortable) charSortable=Sortable.create(charsEl,{handle:'.char-grip',draggable:'.char',animation:REDUCED?0:150,onEnd:()=>{
    const m=Object.fromEntries(P().chars.map(c=>[c.id,c]));
    P().chars=[...charsEl.querySelectorAll('.char')].map(el=>m[el.dataset.id]).filter(Boolean); touch(); renderBoard();
  }});
}
const charOf=el=>P().chars.find(c=>c.id===el.closest('.char')?.dataset.id);
function addChar(){
  const p=P(); const used=new Set(p.chars.map(c=>c.color));
  const c=normalize({chars:[{id:rid('c'),name:'',color:KCOL.find(k=>!used.has(k))||'k1',images:[]}],sections:[]}).chars[0];
  p.chars.push(c); touch(); renderChars(); renderBoard();
  requestAnimationFrame(()=>{ const t=charsEl.querySelector(`.char[data-id="${c.id}"] .char-name`); t?.focus(); t?.scrollIntoView({block:'nearest'}); });
}
let nameTimer=null;
charsEl.addEventListener('input',e=>{
  const t=e.target; const f=t.dataset.f; if(!f) return; const c=charOf(t); if(!c) return;
  c[f]=t.value; touch();
  if(f==='name'){ clearTimeout(nameTimer); nameTimer=setTimeout(renderBoard,400); }
  sideSoon();
});
let imgTarget=null;
charsEl.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b) return;
  if(b.dataset.act==='addchar') return addChar();
  const c=charOf(b); if(!c) return;
  const act=b.dataset.act;

function loadImg(src){ return new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=src; }); }
async function shrink(file,max,asBlob,q){
  const url=URL.createObjectURL(file);
  try{
    const img=await loadImg(url); const r=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
    const cv=document.createElement('canvas'); cv.width=Math.round(img.naturalWidth*r); cv.height=Math.round(img.naturalHeight*r);
    const png=file.type==='image/png';
    const ctx=cv.getContext('2d'); if(!png){ ctx.fillStyle='#fff'; ctx.fillRect(0,0,cv.width,cv.height); }
    ctx.drawImage(img,0,0,cv.width,cv.height);
    const type=png?'image/png':'image/jpeg';
    if(asBlob) return await new Promise(r2=>cv.toBlob(r2,type,q));
    return cv.toDataURL(png&&!asBlob?'image/webp':type,q);
  }finally{ URL.revokeObjectURL(url); }
}
async function addImages(c,files){
  toast(`画像を${files.length}枚追加しています…`);
  let fails=0;
  for(const f of files){
    try{
      c.images.push({d:await shrink(f,1200,false,.84)});
    }catch{ fails++; }
  }
  touch(); renderChars();
  toast(fails?`${fails}枚の画像を読み込めませんでした`:'画像を追加しました');
}
function viewImage(c,i){
  const im=c.images[i]; if(!im) return;
  modal({title:c.name||'画像',body:[h('img',{class:'viewer-img',src:imgSrc(im),alt:''})],actions:[

    i>0?{label:'メイン画像にする',fn:close=>{ c.images.splice(i,1); c.images.unshift(im); touch(); renderChars(); close(); }}:null,
    {label:'閉じる',primary:true,fn:close=>close()}
  ]});
}

function fsStatus(p){

function tempPoints(p){
  const out=[];
  p.sections.forEach(s=>s.scenes.forEach((n,j)=>out.push({sec:s,scene:n,label:n.title||(s.scenes.length>1?`${s.title||'？'}${j+1}`:'')})));
  return out;
}
const fit=(t,n)=>t.length>n?t.slice(0,Math.max(1,n-1))+'…':t;
function tempGeom(n){ const step=Math.max(68,Math.min(150,900/Math.max(n,1))); const g={step,padL:52,padR:14,padT:26,padB:58,H:240}; g.W=g.padL+g.padR+step*Math.max(n,1); g.ph=g.H-g.padT-g.padB; return g; }
function tempMarkup(p,C,live){
  const pts=tempPoints(p), n=pts.length, g=tempGeom(n);
  const X=i=>g.padL+g.step*i+g.step/2, Y=v=>g.padT+(10-v)/10*g.ph;
  const vals=pts.map(q=>q.scene.temp); const max=Math.max(-1,...vals.filter(v=>v!=null));
  const font='Zen Kaku Gothic New, Hiragino Kaku Gothic ProN, Yu Gothic, Meiryo, sans-serif';
  let o=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${g.W} ${g.H}" width="${g.W}" height="${g.H}" font-family="${font}" role="img" aria-label="${esc(p.tempTitle||'温度グラフ')}">`;
  if(C.bg) o+=`<rect width="${g.W}" height="${g.H}" style="fill:${C.bg}"/>`;
  [[10,p.tempHigh||'10'],[5,'5'],[0,p.tempLow||'0']].forEach(([v,l])=>{
    o+=`<line x1="${g.padL}" x2="${g.W-g.padR}" y1="${Y(v)}" y2="${Y(v)}" style="stroke:${C.grid};stroke-width:1" ${v===5?'stroke-dasharray="3 4"':''}/>`;
    o+=`<text x="${g.padL-8}" y="${Y(v)+4}" text-anchor="end" font-size="11" style="fill:${C.text}">${esc(fit(String(l),4))}</text>`;
  });
  // 区切りの帯と名前、区切りの境目
  let i0=0;
  p.sections.forEach((s,si)=>{
    const k=s.scenes.length; if(!k) return; const a=i0, b=i0+k-1; i0+=k;
    const x1=X(a)-g.step/2+6, x2=X(b)+g.step/2-6, col=C.hue(s.hue);
    if(si>0) o+=`<line x1="${X(a)-g.step/2}" x2="${X(a)-g.step/2}" y1="${g.padT-8}" y2="${g.padT+g.ph}" style="stroke:${C.grid};stroke-width:1" stroke-dasharray="2 4"/>`;
    o+=`<line x1="${x1}" x2="${x2}" y1="${g.H-27}" y2="${g.H-27}" style="stroke:${col};stroke-width:3;stroke-linecap:round"/>`;
    o+=`<text x="${(x1+x2)/2}" y="${g.H-9}" text-anchor="middle" font-size="12" font-weight="700" style="fill:${col}">${esc(fit(s.title||'（名前なし）',Math.floor((x2-x1)/12.5)))}</text>`;
  });
  for(let i=0;i<n-1;i++) if(vals[i]!=null&&vals[i+1]!=null)
    o+=`<line x1="${X(i)}" y1="${Y(vals[i])}" x2="${X(i+1)}" y2="${Y(vals[i+1])}" style="stroke:${C.line};stroke-width:3;stroke-linecap:round"/>`;
  pts.forEach((q,i)=>{
    const x=X(i), v=q.scene.temp, name=q.label||q.sec.title||'（名前なし）';
    if(live) o+=`<rect class="col" data-i="${i}" x="${x-g.step/2}" y="${g.padT-14}" width="${g.step}" height="${g.ph+28}" style="fill:transparent"/>`;
    if(q.label) o+=`<text x="${x}" y="${g.H-37}" text-anchor="middle" font-size="11" style="fill:${C.label}">${esc(fit(q.label,Math.floor((g.step-6)/11)))}</text>`;
    const aria=live?`class="pt" data-i="${i}" tabindex="0" role="slider" aria-label="${esc(name)}" aria-valuemin="0" aria-valuemax="10" `:'';
    if(v==null){
      o+=`<g ${aria}${live?'aria-valuetext="未設定"':''}><circle class="ring" cx="${x}" cy="${Y(0)}" r="9" style="fill:transparent;stroke:transparent"/><circle cx="${x}" cy="${Y(0)}" r="5" style="fill:none;stroke:${C.empty};stroke-width:1.5" stroke-dasharray="2 2"/></g>`;
    }else{
      const peak=v===max&&max>0;
      o+=`<g ${aria}${live?`aria-valuenow="${v}"`:''}>`+
        `<circle class="ring" cx="${x}" cy="${Y(v)}" r="${peak?11:9}" style="fill:transparent;stroke:${peak?C.peak:'transparent'};stroke-width:2;stroke-opacity:${peak?.45:0}"/>`+
        `<circle cx="${x}" cy="${Y(v)}" r="6" style="fill:${C.line}"/>`+
        `<text x="${x}" y="${Y(v)-14}" text-anchor="middle" font-size="12" font-weight="700" style="fill:${C.val}">${v}</text></g>`;
    }
  });
  return o+'</svg>';
}

function tempFromEvent(e){
  const svg=tempWrap.querySelector('svg'); if(!svg||dragI==null) return;
  const pt=svg.createSVGPoint(); pt.x=e.clientX; pt.y=e.clientY;

let popEl=null;
function popover(anchor,build){
  popEl?.remove();
  const close=()=>{ popEl?.remove(); popEl=null; document.removeEventListener('pointerdown',outside,true); document.removeEventListener('keydown',esc); document.querySelectorAll('.card.menu-open').forEach(c=>c.classList.remove('menu-open')); };
  const outside=e=>{ if(popEl&&!popEl.contains(e.target)&&e.target!==anchor) close(); };
  const esc=e=>{ if(e.key==='Escape') close(); };
  popEl=h('div',{class:'pop',role:'menu'},build(close));
  document.body.append(popEl);
  const r=anchor.getBoundingClientRect(); const w=popEl.offsetWidth;
  popEl.style.top=(r.bottom+scrollY+6)+'px';
  popEl.style.left=Math.max(8,Math.min(r.right-w,innerWidth-w-8)+scrollX)+'px';
  setTimeout(()=>{ document.addEventListener('pointerdown',outside,true); document.addEventListener('keydown',esc); });
  popEl.querySelector('button')?.focus({preventScroll:true});
}
function modal({title,body,actions=[]}){

/* ================= bulk input ================= */
function splitBlocks(text){
  return text.replace(/\r\n?/g,'\n').split(/\n(?:[ \t　]*\n)+/).map(s=>s.replace(/^\s*\n|\n\s*$/g,'').replace(/^[ \t　]+$/,'')).filter(s=>s.trim());
}
function matchChar(n){
  n=n.replace(/[\s　]/g,''); if(!n) return null;
  for(const c of P().chars){
    const full=c.name.replace(/[\s　]/g,''); const parts=c.name.split(/[\s　]+/).filter(Boolean);
    if(full===n||parts.includes(n)||(n.length>=2&&full.includes(n))) return c.id;
  }
  return null;
}
function parseBlock(b,def){
  let type=def.type, speaker=def.speaker, text=b;
  if(def.smart){
    let m=text.match(/^([^\n「『（(：:]{1,16})[：:][ \t　]*([\s\S]+)$/);
    if(m){ const id=matchChar(m[1]); if(id){ speaker=id; text=m[2]; if(type!=='mono') type='serif'; } }
    m=text.match(/^([^\n「『（(]{1,16})[「『]([\s\S]*)[」』]$/);
    if(m){ const id=matchChar(m[1]); if(id){ speaker=id; text=m[2]; type='serif'; } }
    m=text.match(/^[（(]([\s\S]*)[）)]$/);
    if(m){ text=m[1]; type='mono'; }
    else if(/^[「『][\s\S]*[」』]$/.test(text)&&!text.slice(1,-1).match(/[」』]/)){ text=text.slice(1,-1); type='serif'; }
  }
  if(type!=='serif'&&type!=='mono') speaker='';
  return {id:rid('k'),type,speaker:speaker||'',text:text.trim()};
}

/* ================= text export (CLIP STUDIO story editor) ================= */
function buildText(p,o){
  const out=[];
  for(const s of p.sections){
    if(o.heads&&s.title.trim()) out.push('■'+s.title.trim());
    for(const n of s.scenes){
    if(o.heads&&n.title.trim()) out.push('□'+n.title.trim());
    for(const c of n.cards){
      if(!o.types.includes(c.type)) continue;
      let t=c.text.replace(/\r\n?/g,'\n').replace(/\n(?:[ \t　]*\n)+/g,'\n').trim();
      if(!t) continue;
      if(o.names){ const ch=p.chars.find(x=>x.id===c.speaker); if(ch&&ch.name) t=ch.name+(c.type==='mono'?'（M）':'')+'：'+t; }
      out.push(t);
    }
    }
  }
  return out;
}

const MIME={txt:'text/plain;charset=utf-8',json:'application/json',png:'image/png',pdf:'application/pdf'};
const IS_TOUCH=matchMedia('(hover:none),(pointer:coarse)').matches;
async function saveFile(name,data){
  const ext=name.split('.').pop().toLowerCase();
  let blob=data instanceof Blob?data:new Blob([ext==='txt'?'﻿'+data:data],{type:MIME[ext]||'application/octet-stream'});
  if(window.plotchoNative){ // PC版: 保存ダイアログで場所を選ぶ
    try{ const ok=await window.plotchoNative.saveFile(name,await blob.arrayBuffer()); if(ok) toast('保存しました'); return ok; }
    catch(e){ console.warn(e); toast('保存できませんでした'); return false; }
  }
  if(IS_TOUCH&&navigator.canShare&&typeof File==='function'){
    try{
      const file=new File([blob],name,{type:blob.type});
      if(navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:name}); return true; }
    }catch(e){ if(e&&e.name==='AbortError') return false; }
  }
  try{
    const url=URL.createObjectURL(blob);
    const a=h('a',{href:url,download:name,style:'display:none'}); document.body.append(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),10000);
    toast('保存しました'); return true;
  }catch(e){ console.warn(e); toast('保存できませんでした'); return false; }
}

function exFs(p,c){
  if(!c.fs) return null; const f=p.foreshadows.find(x=>x.id===c.fs.id); if(!f) return null;
  return h('span',{class:'fs'},(c.fs.role==='set'?'◇ ':'◆ ')+(f.name||'伏線')+(c.fs.role==='set'?'（張る）':'（回収）'));
}
function exLine(p,c){
  const ch=p.chars.find(x=>x.id===c.speaker);
  return h('div',{class:'ex-line brk'},
    h('div',{class:'ex-who'},ch?.name||'',h('i',null,TYPE_LABEL[c.type]),exFs(p,c)),
    h('div',{class:'ex-b '+c.type},c.text||' '));
}
function exPlotList(p){
  return p.sections.map(s=>[
    h('div',{class:'ex-sec-h brk',style:`--hue:${EXC[s.hue]}`},h('b',null,s.title||'（名前なし）'),h('span',null,(s.pages?s.pages+'P ・ ':'')+allCards(s).length+'枚')),
    ...s.scenes.flatMap(n=>[n.title?h('div',{class:'ex-scene-h brk',style:`--hue:${EXC[s.hue]}`},n.title):null,...n.cards.map(c=>exLine(p,c))])]);
}
function exPlotBoard(p){
  return h('div',{class:'ex-board'},...p.sections.map(s=>h('div',{class:'ex-col',style:`--hue:${EXC[s.hue]}`},
    h('div',{class:'ex-col-h brk'},h('b',{style:'color:var(--hue)'},s.title||'（名前なし）'),h('span',null,s.pages?s.pages+'P':'')),
    ...s.scenes.flatMap(n=>[n.title?h('div',{class:'ex-scene-h brk',style:`--hue:${EXC[s.hue]}`},n.title):null,...n.cards.map(c=>{ const ch=p.chars.find(x=>x.id===c.speaker);
      return h('div',{class:'ex-card brk'},h('div',{class:'ex-who'},(ch?.name?ch.name+' ・ ':'')+TYPE_LABEL[c.type],exFs(p,c)),h('div',{class:'ex-b '+c.type},c.text||' ')); })]))));
}
function exExtras(p){
  const out=[];
  if(p.foreshadows.length){
    out.push(h('div',{class:'ex-part brk'},'伏線'));
    out.push(h('div',{class:'ex-fs'},...fsStatus(p).map(({f,sets,pays,st})=>h('div',{class:'ex-fs-row brk'},
      h('em',null,f.name||'名前なし'),h('span',{style:st==='open'?'color:#C8402F;font-weight:700':''},FS_ST[st][0]),
      h('div',null,h('small',null,'張る：'+(sets.map(o=>o.s.title).join('、')||'—')),h('small',null,'回収：'+(pays.map(o=>o.s.title).join('、')||'—')))))));
  }
  return out;
}
function exNotes(p){
  if(!p.notes.length) return [];
  return [h('div',{class:'ex-part brk'},'作品の設定'),
    h('div',{class:'ex-notes'},...p.notes.map(n=>h('div',{class:'ex-note brk'},h('h3',null,n.title||'（題名なし）'),h('p',null,n.body))))];
}
function exChars(p){
  if(!p.chars.length) return [h('p',{class:'brk',style:'color:var(--ex-ink-2)'},'キャラが登録されていません')];
  return [h('div',{class:'ex-chars'},...p.chars.map(c=>h('div',{class:'ex-char brk',style:`--cc:${EXC[c.color]}`},
    h('div',{class:'ex-char-imgs'},
      c.images[0]?h('img',{class:'m',src:imgSrc(c.images[0]),alt:''}):h('div',{class:'ph'},'画像なし'),
      c.images.length>1?h('div',{class:'ts'},...c.images.slice(1).map(im=>h('img',{src:imgSrc(im),alt:''}))):null),
    h('div',null,
      h('h2',null,c.name||'名前未設定'), h('div',{class:'ex-kana'},c.kana||''),
      h('div',{class:'ex-tbl'},...FIELDS.filter(([k])=>k!=='kana').map(([k,l])=>h('div',null,h('span',null,l),c[k]||'—'))),
      ...LONG.filter(([k])=>c[k].trim()).map(([k,l])=>h('div',{class:'ex-long'},h('span',null,l),h('p',null,c[k]))))
  )))];
}
function buildStage(p,o){
  const n={serif:0,mono:0,nare:0,memo:0}; let pages=0;
  p.sections.forEach(s=>{ pages+=s.pages; allCards(s).forEach(c=>n[c.type]++); });
  const boardW=p.sections.length*266+96;
  const width=(o.what!=='chars'&&o.shape==='board')?Math.max(900,boardW):860;
  const d=new Date();
  const root=h('div',{class:'ex',style:`width:${width}px`},
    h('div',{class:'ex-h brk'},h('h1',null,p.title||'無題のプロット'),
      h('div',{class:'ex-meta'},`全${pages}P${p.target?'（目標'+p.target+'P）':''} ・ ${p.sections.length}区切り ・ セリフ${n.serif} モノローグ${n.mono}`,h('br'),`${d.getFullYear()}.${d.getMonth()+1}.${d.getDate()} 書き出し`)),
    o.what!=='chars'?[o.what==='both'?h('div',{class:'ex-part brk'},'プロット'):null,
      o.temp!==false&&tempPoints(p).some(q=>q.scene.temp!=null)?h('div',{class:'ex-temp brk'},h('div',{class:'ex-cap'},p.tempTitle||'温度グラフ'),
        h('img',{src:'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(tempMarkup(p,EX_COL,false)),alt:''})):null,
      o.shape==='board'?exPlotBoard(p):exPlotList(p), ...exExtras(p)]:null,
    o.what!=='plot'?[o.what==='both'?h('div',{class:'ex-part brk'},'キャラ・設定'):null, ...exChars(p), ...exNotes(p)]:null);
  const stage=$('#stage'); stage.replaceChildren(root);
  return root;
}
async function waitImages(root){
  await Promise.all([...root.querySelectorAll('img')].map(i=>i.complete?null:new Promise(r=>{ i.onload=i.onerror=r; })));
  try{ await document.fonts.ready; }catch{}
}
function breakPoints(root){
  const top=root.getBoundingClientRect().top;
  const rects=[...root.querySelectorAll('.brk')].map(el=>{ const r=el.getBoundingClientRect(); return [r.top-top,r.bottom-top]; });
  const cands=[...new Set(rects.map(r=>Math.ceil(r[1])+6))].sort((a,b)=>a-b);
  return cands.filter(y=>!rects.some(([t,b])=>t<y-1&&b>y+1));
}
async function doExport(o,status){
  const p=P();
  status('準備しています…');
  await loadScript(H2C); if(o.fmt==='pdf') await loadScript(JSPDF);
  const root=buildStage(p,o); await waitImages(root);
  const W=root.offsetWidth, Hh=root.offsetHeight;
  const scale=Math.min(2,14000/Hh,14000/W);
  status('画像にしています…');
  const canvas=await html2canvas(root,{scale,backgroundColor:'#ffffff',useCORS:true,logging:false});
  const base=safeName(p.title)+(o.what==='chars'?'_キャラ・設定':o.what==='both'?'_プロットとキャラ':'_プロット');
  if(o.fmt==='png'){
    const blob=await new Promise(r=>canvas.toBlob(r,'image/png'));
    $('#stage').replaceChildren();
    return {blob,name:base+'.png',url:URL.createObjectURL(blob)};
  }
  status('PDFにしています…');
  const landscape=W>1000;
  const pdf=new window.jspdf.jsPDF({orientation:landscape?'landscape':'portrait',unit:'mm',format:'a4'});
  const pw=landscape?297:210, ph=landscape?210:297, m=10;
  const ratio=(pw-m*2)/W; const pageH=(ph-m*2)/ratio;
  const bps=breakPoints(root); $('#stage').replaceChildren();
  let start=0, first=true;
  while(start<Hh-1){
    let end=start+pageH;
    if(end>=Hh) end=Hh;
    else{ const ok=bps.filter(y=>y>start+pageH*.35&&y<=start+pageH); if(ok.length) end=ok[ok.length-1]; }
    const sy=Math.round(start*scale), sh=Math.max(1,Math.round((end-start)*scale));
    const cv=document.createElement('canvas'); cv.width=canvas.width; cv.height=Math.min(sh,canvas.height-sy);
    const ctx=cv.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,cv.width,cv.height);
    ctx.drawImage(canvas,0,sy,canvas.width,cv.height,0,0,cv.width,cv.height);
    if(!first) pdf.addPage(); first=false;
    pdf.addImage(cv.toDataURL('image/jpeg',.92),'JPEG',m,m,pw-m*2,(cv.height/scale)*ratio);
    start=end;
  }
  const blob=pdf.output('blob');
  return {blob,name:base+'.pdf'};
}
function openExport(){
  const o=Object.assign({what:'plot',shape:'list',fmt:'pdf',temp:true},lsGet(LS_EXP)||{});
  const pills=(name,list)=>h('div',{class:'radio-pills',role:'radiogroup'},...list.map(([v,l])=>{
    const i=h('input',{type:'radio',name,value:v,checked:o[name]===v});
    i.addEventListener('change',()=>{ o[name]=v; lsSet(LS_EXP,o); sync(); });
    return h('label',null,i,h('span',null,l));
  }));
  const tempChk=h('input',{type:'checkbox',id:'expTemp',checked:o.temp!==false});
  tempChk.addEventListener('change',()=>{ o.temp=tempChk.checked; lsSet(LS_EXP,o); });
  const hasTemp=tempPoints(P()).some(q=>q.scene.temp!=null);
  const shapeBox=h('div',{style:'display:flex;flex-direction:column;gap:10px'},
    h('div',null,h('p',{class:'group-title'},'プロットの見た目'),pills('shape',[['list','一覧（上から読む）'],['board','ボード（見たまま）']])),
    h('div',null,h('p',{class:'group-title'},'入れるもの'),h('div',{class:'opt-grid'},
      h('label',null,tempChk,'温度グラフ'+(P().tempTitle?`（${P().tempTitle}）`:'')+(hasTemp?'':'　※まだ点を付けていません')))));
  const msg=h('p',{class:'hint',style:'margin:0'});
  const out=h('div',{style:'display:flex;flex-direction:column;gap:8px'});
  const sync=()=>{ shapeBox.hidden=o.what==='chars'; msg.textContent=o.fmt==='pdf'?'A4サイズで、カードの途中でページが切れないように分けます。':'1枚の長い画像になります。'; };
  sync();
  let busy=false;
  const run={label:'書き出す',primary:true,id:'expRun',fn:async()=>{
    if(busy) return; busy=true; const btn=$('#expRun'); btn.disabled=true; out.replaceChildren();
    try{
      const r=await doExport(o,t=>{ btn.textContent=t; });
      btn.textContent='書き出す';
      if(downloads){ await saveFile(r.name,r.blob); }
      if(r.url) out.replaceChildren(h('img',{class:'result-img',src:r.url,alt:'書き出した画像'}),!downloads?h('p',{class:'hint',style:'margin:0'},'画像を右クリック（長押し）して保存してください。'):null);
      else if(!downloads) out.replaceChildren(h('p',{class:'hint',style:'margin:0'},'この表示ではPDFを保存できません。PNGを選ぶと画像として表示できます。'));
    }catch(err){ console.error(err); btn.textContent='書き出す'; toast('書き出しに失敗しました。もう一度お試しください'); }
    finally{ busy=false; btn.disabled=false; }
  }};
  modal({title:'PNG・PDFで書き出す',body:[
    h('div',null,h('p',{class:'group-title'},'書き出す内容'),pills('what',[['plot','プロット'],['chars','キャラ・設定'],['both','両方']])),
    shapeBox,
    h('div',null,h('p',{class:'group-title'},'形式'),pills('fmt',[['pdf','PDF'],['png','PNG']])),
    msg,out
  ],actions:[{label:'閉じる',fn:c=>c()},run]});
}


/* ---------- light / dark ---------- */
const LS_THEME='plotcho.theme';
const HOST_THEME=document.documentElement.getAttribute('data-theme');
let theme=['auto','light','dark'].includes(lsGet(LS_THEME))?lsGet(LS_THEME):'auto';
const THEME_LABEL={auto:'端末に合わせる',light:'ライト',dark:'ダーク'};
const THEME_ICON={
  auto:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg>',
  light:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  dark:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>'
};
const themeMetas=[...document.querySelectorAll('meta[name="theme-color"]')].map(m=>[m,m.getAttribute('content')]);
function applyTheme(){
  const root=document.documentElement;
  if(theme==='auto'){ if(HOST_THEME) root.setAttribute('data-theme',HOST_THEME); else root.removeAttribute('data-theme'); }
  else root.setAttribute('data-theme',theme);
  themeMetas.forEach(([m,orig])=>m.setAttribute('content',theme==='auto'?orig:(theme==='dark'?'#1A1F29':'#FFFFFF')));
  const b=$('#themeBtn'); if(b){ b.innerHTML=THEME_ICON[theme]; b.title='表示：'+THEME_LABEL[theme]; }
}
function setTheme(t){ theme=t; lsSet(LS_THEME,t); applyTheme(); renderTemp(); }
function themeItems(close){
  return [h('div',{class:'label'},'表示の明るさ'),
    ...['auto','light','dark'].map(k=>h('button',{class:'item'+(theme===k?' on':''),onclick:()=>{ close(); setTheme(k); }},THEME_LABEL[k]))];
}
$('#themeBtn').addEventListener('click',e=>popover(e.currentTarget,close=>themeItems(close)));
applyTheme();

/* ================= projects menu & backup ================= */
async function newProject(title){
  const p=blankProject(title); projects[p.id]=p; cur=p.id; lsSet(LS_CUR,cur); touch(p); renderAll();
  requestAnimationFrame(()=>{ const t=$('#projTitle'); tab='plot'; t.focus(); t.select(); });
}
$('#projMenuBtn').addEventListener('click',e=>{
  const p=P();
  popover(e.currentTarget,close=>[
    h('button',{class:'item',onclick:()=>{ close(); flush().finally(()=>{ location.href='help.html'; }); }},'使いかた'),
    h('hr'),
    h('button',{class:'item',onclick:()=>{ close(); tab='plot'; newProject('無題のプロット'); }},'新しい作品'),
    h('button',{class:'item',onclick:()=>{ close(); const c=normalize({...clone(p),id:rid('p'),title:p.title+'のコピー',createdAt:Date.now(),sample:false}); projects[c.id]=c; cur=c.id; touch(c); renderAll(); toast('複製しました'); }},'この作品を複製'),
    h('hr'),
    downloads?h('button',{class:'item',onclick:()=>{ close(); saveFile('プロット帖_バックアップ_'+today()+'.json',JSON.stringify({app:'plotcho',v:1,projects:Object.values(projects)},null,1)); }},'バックアップを保存（全作品）'):null,
    h('button',{class:'item',onclick:()=>{ close(); $('#jsonInput').click(); }},'バックアップを読み込む'),
    h('hr'),
    ...themeItems(close),
    h('hr'),
    h('button',{class:'item danger',onclick:async()=>{
      close();
      if(!await confirmBox('作品を削除',`「${p.title}」を削除します。プロットとキャラ設定がすべて消え、元に戻せません。`,'削除する')) return;
      delete projects[p.id]; dirty.delete(p.id);
      IDB.del(p.id).catch(()=>{});
      if(p.remoteId){ const t=lsGet(LS_TOMB)||{}; t[p.id]=Date.now(); lsSet(LS_TOMB,t); scheduleSync(); }
      cur=firstId(); if(!cur){ const b=blankProject(); projects[b.id]=b; cur=b.id; touch(b); }
      saveLocal(); renderAll(); toast('削除しました');
    }},'この作品を削除')
  ]);
});
$('#jsonInput').addEventListener('change',async e=>{
  const f=e.target.files[0]; e.target.value=''; if(!f) return;
  try{
    const d=JSON.parse(await f.text()); const list=Array.isArray(d)?d:(d.projects||[]);
    let n=0, lost=0;
    for(const raw of list){ if(!raw||!Array.isArray(raw.sections)) continue;
      const p=normalize({...clone(raw),id:rid('p'),sample:false,remoteId:null,syncedAt:0}); if(projects[raw.id]) p.title+='（読み込み）';
      p.chars.forEach(c=>{ const before=c.images.length; c.images=c.images.filter(i=>i.d); if(c.images.length<before) lost++; });
      projects[p.id]=p; touch(p); cur=p.id; n++; }
    if(!n) throw 0; renderAll(); toast(`${n}件の作品を読み込みました`+(lost?`（${lost}人分の画像は入っていませんでした）`:''));
  }catch{ toast('このファイルは読み込めませんでした'); }
});
$('#projSel').addEventListener('change',e=>{ selected.clear(); cur=e.target.value; lsSet(LS_CUR,cur); renderAll(); });
$('#projTitle').addEventListener('input',e=>{
  P().title=e.target.value; touch();
  const o=$('#projSel').querySelector(`option[value="${cur}"]`); if(o) o.textContent=e.target.value||'無題のプロット';
});
$('#tabPlot').addEventListener('click',()=>{ tab='plot'; lsSet(LS_TAB,tab); renderAll(); });
$('#tabChars').addEventListener('click',()=>{ tab='chars'; lsSet(LS_TAB,tab); renderAll(); });
$('#layCols').addEventListener('click',()=>{ P().layout='cols'; touch(); renderAll(); });
$('#layRows').addEventListener('click',()=>{ P().layout='rows'; touch(); renderAll(); });
$('#bulkBtn').addEventListener('click',()=>openBulk());
$('#addSecBtn').addEventListener('click',()=>addSection());
$('#addCharBtn').addEventListener('click',addChar);
$('#hideSample').addEventListener('click',()=>{ P().sample=false; touch(); renderAll(); });
$('#newFromSample').addEventListener('click',()=>newProject('無題のプロット'));
addEventListener('pagehide',()=>{ flush(); });
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='hidden'){ flush(); if(syncOn()&&Drive.hasToken()) syncNow(false); }
  else if(syncOn()&&Drive.hasToken()) syncNow(false);
});
$('#syncBtn').addEventListener('click',e=>{ if(syncState==='ok'||syncState==='error') syncMenu(e.currentTarget); else syncNow(true); });

/* ================= app shell: offline & updates ================= */
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1')){
  navigator.serviceWorker.register('sw.js').then(reg=>{
    const offer=w=>toast('新しい版があります',{label:'切り替える',fn:()=>w.postMessage('skipWaiting')});
    if(reg.waiting&&navigator.serviceWorker.controller) offer(reg.waiting);
    reg.addEventListener('updatefound',()=>{ const w=reg.installing; if(!w) return;
      w.addEventListener('statechange',()=>{ if(w.state==='installed'&&navigator.serviceWorker.controller) offer(w); }); });
    setInterval(()=>reg.update().catch(()=>{}),60*60*1000);
  }).catch(()=>{});
  let reloaded=false; const hadController=!!navigator.serviceWorker.controller;
  // 初めて開いたとき(まだ何も入っていないとき)は読み込み直さない。新しい版に切り替えたときだけ読み込み直す
  navigator.serviceWorker.addEventListener('controllerchange',()=>{ if(reloaded||!hadController) return; reloaded=true; flush().finally(()=>location.reload()); });
}

/* ================= boot ================= */
(async()=>{
  await loadLocal(); renderAll(); setStatus('saved');
  if(Drive&&Drive.init) await Drive.init();
  if(syncOn()){ setSync(Drive.hasToken()?'ok':(Drive.everConnected()?'need':'off')); if(Drive.hasToken()) syncNow(false); }
})();
})();
