<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>プロット帖</title>
<meta name="description" content="セリフやモノローグをカードで書いて並べ替える、漫画のプロット帳">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1A1F29" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="プロット帖">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<script src="vendor/Sortable.min.js"></script>
<script src="config.js"></script>
<script src="drive.js"></script>
<style>
/* base reset */
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
.sync{height:34px;padding:0 11px;border-radius:999px;border:1px solid var(--line);background:var(--sheet);font-size:12.5px;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ink-3)}
.sync[data-s="ok"]::before{background:var(--ok)}
.sync[data-s="syncing"]::before{background:var(--s5)}
.sync[data-s="need"],.sync[data-s="off"]{color:var(--blue);border-color:var(--blue)}
.sync[data-s="need"]::before,.sync[data-s="off"]::before{background:var(--blue)}
.sync[data-s="error"]{color:var(--red);border-color:var(--red)}
.sync[data-s="error"]::before{background:var(--red)}
/* Layout: sticky toolbar over a dotted 原稿用紙 desk. 区切り are paper columns (or rows); each card is drawn as the balloon it will become — round = セリフ, dashed = モノローグ, square = ナレーション, sticky note = ト書き. */
:root{
  --paper:#ECEFF4; --sheet:#FFFFFF; --sheet-2:#F6F8FB; --ink:#1A2030; --ink-2:#556074; --ink-3:#8791A3;
  --line:#D5DBE5; --dot:#C3CDDC; --blue:#2A66C9; --blue-soft:#E1EAF8; --red:#C8402F; --red-soft:#FAE6E2;
  --memo:#FFF0AE; --memo-ink:#56450F; --ok:#2E8A5E; --ok-soft:#E1F2E9; --warn-soft:#FBF0D8;
  --s1:#2A66C9; --s2:#2E8A5E; --s3:#C8402F; --s4:#7650C2; --s5:#BC820F; --s6:#6A7385;
  --k1:#2A66C9; --k2:#C8402F; --k3:#2E8A5E; --k4:#7650C2; --k5:#BC820F; --k6:#C94E8A;
  --shadow:0 1px 2px rgba(18,28,48,.07),0 6px 18px rgba(18,28,48,.06);
  --f-ui:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;
  --f-type:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
  --ex-bg:#FFFFFF; --ex-ink:#1A2030; --ex-ink-2:#556074; --ex-line:#CDD4DF; --ex-memo:#F3EFDF; --ex-soft:#F5F7FA;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#11141B; --sheet:#1A1F29; --sheet-2:#202634; --ink:#E5E9F1; --ink-2:#A1AABB; --ink-3:#717B8E;
  --line:#2D3443; --dot:#2A3140; --blue:#76A6F0; --blue-soft:#1D2A42; --red:#F07C6C; --red-soft:#3A2220;
  --memo:#3A3418; --memo-ink:#F0E1A0; --ok:#66C597; --ok-soft:#183024; --warn-soft:#3A2F14;
  --s1:#76A6F0; --s2:#5FC08F; --s3:#F07C6C; --s4:#AE91F0; --s5:#E3B04A; --s6:#98A1B3;
  --k1:#76A6F0; --k2:#F07C6C; --k3:#5FC08F; --k4:#AE91F0; --k5:#E3B04A; --k6:#EE86B8;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#11141B; --sheet:#1A1F29; --sheet-2:#202634; --ink:#E5E9F1; --ink-2:#A1AABB; --ink-3:#717B8E;
  --line:#2D3443; --dot:#2A3140; --blue:#76A6F0; --blue-soft:#1D2A42; --red:#F07C6C; --red-soft:#3A2220;
  --memo:#3A3418; --memo-ink:#F0E1A0; --ok:#66C597; --ok-soft:#183024; --warn-soft:#3A2F14;
  --s1:#76A6F0; --s2:#5FC08F; --s3:#F07C6C; --s4:#AE91F0; --s5:#E3B04A; --s6:#98A1B3;
  --k1:#76A6F0; --k2:#F07C6C; --k3:#5FC08F; --k4:#AE91F0; --k5:#E3B04A; --k6:#EE86B8;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--f-ui);font-size:14px;line-height:1.6;
  background-image:radial-gradient(var(--dot) 1px,transparent 1.2px);background-size:18px 18px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--sheet)}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* ---------- App bar ---------- */
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--sheet);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
.bar-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px;letter-spacing:.06em;white-space:nowrap}
.logo-mark{width:22px;height:22px;border:2px solid var(--ink);border-radius:5px;display:grid;place-items:center;font-family:var(--f-type);font-size:12px;line-height:1}
.proj{display:flex;align-items:center;gap:6px;min-width:0;flex:1 1 220px}
.proj select{min-width:0;max-width:100%;flex:1;height:34px;border:1px solid var(--line);border-radius:8px;background:var(--sheet-2);padding:0 8px}
.tabs{display:flex;background:var(--sheet-2);border:1px solid var(--line);border-radius:999px;padding:3px}
.tabs button{border:0;background:transparent;padding:4px 14px;border-radius:999px;font-weight:500;color:var(--ink-2)}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--sheet)}
.bar-actions{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto}
.btn{height:34px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:var(--sheet);font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#0d1422}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#0d1422}}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--sheet-2)}
.btn.danger{color:var(--red)}
.btn.sm{height:28px;padding:0 9px;font-size:12.5px;border-radius:7px}
.icon-btn{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--sheet);display:inline-grid;place-items:center;font-size:16px;line-height:1}
.status{font-size:12px;color:var(--ink-3);white-space:nowrap;display:flex;align-items:center;gap:6px}
.status::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok)}
.status[data-s="saving"]::before{background:var(--s5)}
.status[data-s="error"]::before{background:var(--red)}

/* ---------- Main ---------- */
main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 60px}
.banner{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;background:var(--blue-soft);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:13px}
.banner b{font-weight:700}
.banner .sp{flex:1}
.plot-head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 18px;margin-bottom:14px}
.title-in{font-size:22px;font-weight:700;border:0;border-bottom:2px solid transparent;background:transparent;padding:2px 0;min-width:0;flex:1 1 260px;max-width:640px}
.title-in:hover,.title-in:focus{border-bottom-color:var(--line);outline:none}
.stats{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.stats b{color:var(--ink);font-size:15px;font-weight:700;margin-right:2px}
.tools{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--sheet)}
.seg button{border:0;background:transparent;height:30px;padding:0 11px;font-size:12.5px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--sheet)}
.hint{font-size:12px;color:var(--ink-3)}
.tools .hint{margin-left:auto}

/* ---------- Board ---------- */
.board-scroll{overflow-x:auto;margin-inline:-4px;padding:4px 4px 12px}
.board-scroll.nosnap{scroll-snap-type:none!important;scroll-behavior:auto!important}
.card.selected .bubble{box-shadow:0 0 0 3px var(--blue-soft),0 0 0 5px var(--blue)}
.card.selected::before{content:"✓";position:absolute;left:-7px;top:-8px;z-index:3;width:20px;height:20px;border-radius:50%;background:var(--blue);color:var(--sheet);font-size:12px;font-weight:700;display:grid;place-items:center;box-shadow:0 0 0 2px var(--sheet)}
.board.selecting .card .bubble{cursor:pointer}
.board.selecting .card-tools{display:none}
.card.multi-ghost{opacity:.3}
.sortable-fallback[data-count]::after{content:attr(data-count);position:absolute;right:-8px;top:-10px;min-width:24px;height:24px;padding:0 6px;border-radius:12px;background:var(--blue);color:#fff;font:700 13px/24px var(--f-ui);text-align:center;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.selbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:50;display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:center;
  background:var(--ink);color:var(--sheet);border-radius:14px;padding:8px 10px;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:calc(100% - 24px)}
.selbar b{font-size:14px;padding:0 6px;white-space:nowrap;font-variant-numeric:tabular-nums}
.selbar button{height:34px;border-radius:9px;border:0;padding:0 12px;background:rgba(255,255,255,.12);color:inherit;font-weight:500;white-space:nowrap}
.selbar button:hover{background:rgba(255,255,255,.22)}
.selbar button.danger{color:#FFB4A8}
.selbar button.x{background:transparent;font-size:18px;padding:0 8px}
body.has-selbar .toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
@media (max-width:640px){.selbar{left:10px;right:10px;transform:none;max-width:none;flex-wrap:nowrap;justify-content:space-between;gap:4px;padding:7px 8px}.selbar b{font-size:12.5px;padding:0 2px}.selbar button{padding:0 9px;font-size:13px}.selbar button.x{padding:0 4px}}
body.has-selbar main{padding-bottom:120px}
.pop .dest{display:flex;flex-direction:column;max-height:min(60vh,420px);overflow:auto}
.pop .dest .sec-l{font-size:11.5px;font-weight:700;padding:8px 10px 2px;color:var(--hue)}
.pop .dest .item{padding-left:20px}
.idea-add{display:flex;flex-direction:column;gap:6px}
.idea-add textarea{width:100%;border:1px solid var(--line);border-radius:10px;background:var(--sheet-2);padding:8px 10px;resize:vertical;min-height:64px;font:inherit;line-height:1.6}
.idea-add textarea:focus{outline:none;border-color:var(--blue);background:var(--sheet)}
.idea-add-row{display:flex;align-items:center;gap:8px}
.idea-add-row .hint{flex:1;min-width:0}
.idea-list{display:flex;flex-direction:column;gap:12px;min-height:60px}
.card.idea .bubble{cursor:grab}
.card.idea.editing .bubble{cursor:text}
.idea-meta{display:flex;align-items:center;gap:2px;font-size:11px;color:var(--ink-3);margin-top:3px;padding-left:2px}
.idea-meta .date{margin-right:auto;font-variant-numeric:tabular-nums}
.card.idea .mini{opacity:1}
.tools .btn .cnt{font-size:11px;font-weight:700;color:var(--ink-3)}
.tools .btn[aria-pressed="true"] .cnt{color:inherit}
.board{display:flex;gap:14px;align-items:flex-start}
.board.rows{flex-direction:column;align-items:stretch}
.sec{background:var(--sheet);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);display:flex;flex-direction:column;
  border-top:4px solid var(--hue,var(--s6));width:300px;flex:0 0 300px}
.board.rows .sec{width:auto;flex:none}
.sec-head{display:flex;align-items:center;gap:6px;padding:8px 8px 6px 4px}
.grip{border:0;background:transparent;color:var(--ink-3);cursor:grab;width:24px;height:28px;border-radius:6px;font-size:13px;letter-spacing:-2px;touch-action:none;flex:none}
.grip:hover{background:var(--sheet-2);color:var(--ink)}
.grip:active{cursor:grabbing}
.sec-title{flex:1;min-width:0;border:0;background:transparent;font-weight:700;font-size:17px;color:var(--hue);padding:2px 4px;border-radius:6px}
.sec-title:hover,.sec-title:focus{background:var(--sheet-2);outline:none}
.sec-pages{display:flex;align-items:center;gap:2px;font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.sec-pages input{width:44px;height:26px;border:1px solid var(--line);border-radius:6px;background:var(--sheet-2);text-align:right;padding:0 4px}
.sec-menu{border:0;background:transparent;width:28px;height:28px;border-radius:6px;color:var(--ink-2);font-size:16px;line-height:1}
.sec-menu:hover{background:var(--sheet-2)}
.cards{display:flex;flex-direction:column;gap:10px;min-height:40px}
.board.rows .cards{flex-direction:row;flex-wrap:wrap}
.board.rows .card{width:250px}
.empty-cards{font-size:12px;color:var(--ink-3);text-align:center;padding:10px 8px;border:1px dashed var(--line);border-radius:8px;display:flex;flex-direction:column;align-items:center;gap:6px}
.sec-foot{display:flex;flex-wrap:wrap;gap:4px;padding:6px 10px 10px;border-top:1px solid var(--line);margin-top:4px}
.add-chip{border:1px dashed var(--line);background:transparent;border-radius:999px;height:26px;padding:0 10px;font-size:12px;color:var(--ink-2)}
.add-chip:hover{border-style:solid;border-color:var(--ink-3);color:var(--ink)}
.add-sec{width:220px;flex:0 0 220px;min-height:120px;border:2px dashed var(--line);border-radius:12px;background:transparent;color:var(--ink-2);font-weight:500}
.add-sec:hover{border-color:var(--ink-3);color:var(--ink)}
.board.rows .add-sec{width:auto;flex:none;min-height:56px}
.grip-ico{color:var(--ink-3);font-size:13px;letter-spacing:-2px;user-select:none;-webkit-user-select:none;flex:none;line-height:1;min-width:22px;height:28px;display:inline-grid;place-items:center;border-radius:6px;cursor:grab}
.grip-ico:hover{background:var(--sheet-2);color:var(--ink)}
.head-sp{flex:1 1 0;min-width:8px;align-self:stretch;cursor:grab}
@supports (field-sizing:content){.sec-head .sec-title,.scene-head .scene-title{field-sizing:content;flex:0 1 auto;min-width:3em;max-width:100%}}
.sec-head .grip-ico{padding-left:6px}
.scenes{display:flex;flex-direction:column;gap:10px;padding:4px 10px 6px}
.scene{border-radius:10px;min-width:0}
.scene.framed{background:var(--sheet-2);border:1px solid var(--line);border-left:3px solid var(--hue)}
.scene.framed .cards{padding:2px 8px 10px}
.scene-head{display:flex;align-items:center;gap:2px;padding:5px 4px 4px 2px;cursor:grab}
.scene-head:active{cursor:grabbing}
.scene .grip-ico{min-width:20px;height:26px;font-size:12px}
.scene-fold{border:0;background:transparent;width:24px;height:26px;border-radius:6px;color:var(--ink-3);font-size:11px;flex:none}
.scene-fold:hover{background:var(--sheet);color:var(--ink)}
.scene-title{flex:1;min-width:0;border:0;background:transparent;font-weight:700;font-size:13.5px;padding:2px 4px;border-radius:6px;cursor:text;color:var(--ink)}
.scene-title::placeholder{color:var(--ink-3);font-weight:500}
.scene-title:focus{background:var(--sheet);outline:none}
.scene-count{font-size:11.5px;color:var(--ink-3);white-space:nowrap;font-variant-numeric:tabular-nums;padding:0 2px}
.scene.collapsed .cards{display:none}
.scene.collapsed{padding-bottom:2px}
.scene-peek{font-size:12px;color:var(--ink-3);padding:0 10px 8px 30px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.board.rows .scenes{flex-direction:column}
.add-chip.scene-chip{border-style:solid;color:var(--ink)}

/* ---------- Cards ---------- */
.card{position:relative}
.card-bar{display:flex;align-items:center;gap:4px;margin-bottom:4px}
.card-bar .grip{width:20px;height:24px;font-size:11px}
.chip-sel{height:24px;border:1px solid var(--line);border-radius:999px;background:var(--sheet-2);font-size:11.5px;padding:0 6px;max-width:104px;min-width:0}
.chip-sel.cspk{max-width:none;flex:0 1 128px}
.spk{border-left:4px solid var(--kc,var(--line))}
.card-bar .sp{flex:1}
.mini{border:0;background:transparent;width:24px;height:24px;border-radius:6px;color:var(--ink-3);font-size:14px;line-height:1;display:inline-grid;place-items:center;opacity:.55}
.card:hover .mini,.card:focus-within .mini{opacity:1}
.mini:hover{background:var(--sheet-2);color:var(--ink)}
.mini.del:hover{color:var(--red);background:var(--red-soft)}
.bubble{background:var(--sheet)}
.bubble textarea{display:block;width:100%;border:0;background:transparent;resize:none;overflow:hidden;padding:0;min-height:1.6em;line-height:1.65;outline:none}
.t-serif .bubble{border:1.5px solid var(--ink);border-radius:20px;padding:9px 14px}
.t-serif textarea,.t-serif .txt{font-family:var(--f-type);font-size:15px;font-weight:500}
.t-mono .bubble{border:1.5px dashed var(--ink-3);border-radius:10px;padding:8px 12px}
.t-mono textarea,.t-mono .txt{font-family:var(--f-type);font-size:14.5px;color:var(--ink-2)}
.t-nare .bubble{border:1.5px solid var(--ink);border-radius:0;padding:8px 12px;box-shadow:3px 3px 0 var(--line)}
.t-nare textarea,.t-nare .txt{font-size:13.5px}
.t-memo .bubble{background:var(--memo);border-radius:4px;padding:8px 12px;transform:rotate(-.4deg)}
.t-memo textarea,.t-memo .txt{font-size:13px;color:var(--memo-ink)}
/* 置き場所: 点線の枠だけを見せる */
.sortable-ghost{position:relative}
.sortable-ghost > *{visibility:hidden}
.sortable-ghost::after{content:"";position:absolute;inset:0;border:2px dashed var(--blue);border-radius:14px;background:var(--blue-soft);opacity:.75;pointer-events:none}
.card.sortable-ghost .fs-tag{display:none}
/* 持ち上げているもの: 指に吸い付くように */
.sortable-fallback{will-change:transform;opacity:.97!important;z-index:1000!important;pointer-events:none;transition:none!important}
.sortable-fallback > .bubble{transform:rotate(-1.2deg) scale(1.035);box-shadow:0 18px 40px rgba(18,28,48,.30);transition:transform .14s ease-out}
.sortable-fallback.scene,.sortable-fallback.sec{box-shadow:0 18px 40px rgba(18,28,48,.30)}
.sortable-fallback .card-tools,.sortable-fallback .fs-tag{display:none}
.board.dragging .card-tools,body.dragging-any .card-tools{opacity:0!important;pointer-events:none!important}
.board.dragging .card:hover .bubble{cursor:grabbing}
.card-meta{display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;padding:2px 6px 2px 2px;border-radius:6px;font-size:11.5px;color:var(--ink-3);min-width:0;max-width:calc(100% - 64px);cursor:pointer}
.card-meta:hover{background:var(--sheet-2)}
.card-meta .who{font-weight:700;color:var(--ink-2);display:inline-flex;align-items:center;gap:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.card-meta .who::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--kc,var(--line));flex:none}
.card-meta .kind{white-space:nowrap}
.bubble{cursor:grab}
.card-tools{position:absolute;top:-13px;right:10px;z-index:2;display:flex;gap:1px;padding:1px;background:var(--sheet);border:1px solid var(--line);border-radius:8px;box-shadow:0 2px 8px rgba(18,28,48,.12);opacity:0;pointer-events:none;transition:opacity .12s}
.card-tools .mini{opacity:1;width:26px;height:26px}
.card:hover .card-tools,.card.editing .card-tools,.card:focus-within .card-tools,.card.menu-open .card-tools{opacity:1;pointer-events:auto}
.card.dragging-card .card-tools{opacity:0}
.spk-dot{position:absolute;left:-2px;top:-2px;z-index:1;width:11px;height:11px;border-radius:50%;background:var(--kc);border:2px solid var(--sheet);pointer-events:none}
.card .bubble{position:relative}
.card.editing .bubble{cursor:text;box-shadow:0 0 0 3px var(--blue-soft),0 0 0 4px var(--blue)}
#themeBtn svg{width:18px;height:18px;display:block}
.bubble .txt{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.65;min-height:1.65em;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.bubble .txt.empty{color:var(--ink-3)}
.sec-head{cursor:grab}
.sec-head input{cursor:text}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:4px 10px 8px;max-width:300px}
.chip{border:1px solid var(--line);background:var(--sheet);border-radius:999px;height:32px;padding:0 12px;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.chip.spk::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--kc,var(--line))}
.chip.on{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.pop .item.on::after{content:"✓";float:right;margin-left:12px;color:var(--blue)}
.btn .ico{display:none}
@media (hover:none){.hover-only{display:none!important}}

/* ---------- Characters ---------- */
.char-head{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:14px}
.char-head h2{margin:0;font-size:20px}
.chars{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,520px),1fr));gap:16px}
.char{background:var(--sheet);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);display:grid;grid-template-columns:170px minmax(0,1fr);gap:16px;padding:14px;border-top:4px solid var(--cc)}
@media (max-width:560px){.char{grid-template-columns:minmax(0,1fr)}}
.char-img{display:flex;flex-direction:column;gap:8px;min-width:0}
.main-img{aspect-ratio:3/4;width:100%;max-width:100%;border-radius:8px;background:var(--sheet-2);border:1px dashed var(--line);display:grid;place-items:center;overflow:hidden;color:var(--ink-3);font-size:12px;text-align:center;padding:0;cursor:pointer}
.main-img img{width:100%;height:100%;object-fit:cover;display:block}
.main-img.has{border-style:solid}
.char-img.drop .main-img{border-color:var(--blue);background:var(--blue-soft)}
.thumbs{display:flex;flex-wrap:wrap;gap:6px}
.thumb{width:44px;height:44px;border-radius:6px;overflow:hidden;border:1px solid var(--line);padding:0;background:var(--sheet-2)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb.on{outline:2px solid var(--cc);outline-offset:1px}
.thumb.add{display:grid;place-items:center;color:var(--ink-2);font-size:18px;border-style:dashed}
.char-body{min-width:0;display:flex;flex-direction:column;gap:10px}
.char-top{display:flex;align-items:center;gap:6px}
.char-name{flex:1;min-width:0;font-size:19px;font-weight:700;border:0;border-bottom:2px solid var(--cc);background:transparent;padding:2px 2px}
.char-name:focus{outline:none;background:var(--sheet-2)}
.swatches{display:flex;gap:4px}
.sw{width:18px;height:18px;border-radius:50%;border:2px solid var(--sheet);box-shadow:0 0 0 1px var(--line);padding:0}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.fld{display:flex;flex-direction:column;gap:2px;min-width:0}
.fld span{font-size:11px;color:var(--ink-3);letter-spacing:.04em}
.fld input,.fld textarea{width:100%;border:1px solid var(--line);border-radius:7px;background:var(--sheet-2);padding:5px 8px;min-width:0}
.fld textarea{resize:vertical;min-height:52px;line-height:1.55}
.fld input:focus,.fld textarea:focus{border-color:var(--blue);outline:none;background:var(--sheet)}
.add-char{border:2px dashed var(--line);border-radius:12px;background:transparent;min-height:160px;color:var(--ink-2);font-weight:500}
.add-char:hover{border-color:var(--ink-3);color:var(--ink)}

/* ---------- Overlay UI ---------- */
.pop{position:absolute;z-index:60;background:var(--sheet);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:6px;min-width:190px;display:flex;flex-direction:column}
.pop button.item{border:0;background:transparent;text-align:left;padding:7px 10px;border-radius:6px}
.pop button.item:hover{background:var(--sheet-2)}
.pop button.item.danger{color:var(--red)}
.pop .label{font-size:11px;color:var(--ink-3);padding:4px 10px 2px}
.pop .row{display:flex;gap:6px;padding:4px 10px 8px}
.pop hr{border:0;border-top:1px solid var(--line);margin:4px 0;width:100%}
.scrim{position:fixed;inset:0;z-index:70;background:rgba(10,14,22,.45);display:grid;place-items:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal{background:var(--sheet);color:var(--ink);border-radius:14px;width:min(620px,100%);max-height:100%;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.3);overflow:hidden}
.modal h3{margin:0;padding:16px 18px 6px;font-size:17px}
.modal-body{padding:6px 18px 12px;overflow:auto;display:flex;flex-direction:column;gap:12px;min-height:0}
.modal-foot{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--line);background:var(--sheet-2)}
.opt-grid{display:flex;flex-wrap:wrap;gap:6px 16px}
.opt-grid label{display:flex;align-items:center;gap:6px;font-size:13.5px}
.field-row{display:flex;flex-wrap:wrap;gap:10px}
.field-row label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--ink-2);flex:1 1 150px;min-width:0}
.field-row select{height:34px;border:1px solid var(--line);border-radius:8px;background:var(--sheet-2);padding:0 8px}
.big-ta{width:100%;min-height:220px;border:1px solid var(--line);border-radius:10px;background:var(--sheet-2);padding:10px 12px;resize:vertical;line-height:1.7;font-family:var(--f-type);font-size:14.5px}
.big-ta:focus{outline:none;border-color:var(--blue)}
.prev-ta{min-height:180px;font-family:var(--f-ui);font-size:13px}
.count{font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.count b{color:var(--blue);font-size:16px}
.group-title{font-size:12px;color:var(--ink-3);margin:0 0 4px;letter-spacing:.04em}
.radio-pills{display:flex;flex-wrap:wrap;gap:6px}
.radio-pills label{position:relative}
.radio-pills input{position:absolute;opacity:0;pointer-events:none}
.radio-pills span{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:5px 13px;font-size:13px;cursor:pointer;background:var(--sheet)}
.radio-pills input:checked+span{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.radio-pills input:focus-visible+span{outline:2px solid var(--blue);outline-offset:2px}
.radio-pills input:disabled+span{opacity:.4;cursor:not-allowed}
.result-img{max-width:100%;max-height:55vh;object-fit:contain;border:1px solid var(--line);border-radius:8px;align-self:center;background:#fff}
.viewer-img{max-width:100%;max-height:65vh;object-fit:contain;align-self:center;border-radius:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:80;background:var(--ink);color:var(--sheet);border-radius:10px;padding:10px 14px;display:flex;gap:14px;align-items:center;font-size:13px;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.toast button{border:0;background:transparent;color:var(--blue-soft);font-weight:700;text-decoration:underline;padding:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- Page budget ---------- */
.budget{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin:-4px 0 14px}
.target{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--ink-2);white-space:nowrap}
.target input{width:60px;height:28px;border:1px solid var(--line);border-radius:7px;background:var(--sheet);text-align:right;padding:0 6px;font-variant-numeric:tabular-nums}
.bar{flex:1 1 240px;min-width:0;max-width:760px;height:12px;border-radius:999px;background:var(--sheet);border:1px solid var(--line);display:flex;overflow:hidden}
.bar i{display:block;height:100%;background:var(--hue);box-shadow:inset -1px 0 0 var(--sheet);min-width:2px}
.bar i.rest{background:transparent;box-shadow:none}
.bar i.over{background:repeating-linear-gradient(45deg,var(--red) 0 4px,var(--red-soft) 4px 8px)}
.budget-msg{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.budget-msg.over{color:var(--red)} .budget-msg.ok{color:var(--ok)} .budget-msg.left{color:var(--ink-2);font-weight:500}
.sec.over .sec-pages input{border-color:var(--red);color:var(--red);background:var(--red-soft)}

/* ---------- Temperature graph ---------- */
.temp{background:var(--sheet);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:10px 14px 4px;margin-bottom:14px}
.temp-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 12px}
.temp-h{align-items:center}
.temp-title{font:inherit;font-weight:700;font-size:14px;color:var(--ink);border:0;border-bottom:1px dashed var(--line);background:transparent;padding:1px 2px;width:9em;min-width:3em;max-width:100%}
@supports (field-sizing:content){.temp-title{field-sizing:content;width:auto}}
.temp-title:hover{border-bottom-color:var(--ink-3)}
.temp-title:focus{outline:none;border-bottom:1px solid var(--blue);background:var(--sheet-2)}
.temp-ends{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--ink-3)}
.temp-ends input{font:inherit;font-size:12px;color:var(--ink-2);width:4.5em;border:1px solid var(--line);border-radius:6px;background:var(--sheet-2);padding:1px 6px}
@supports (field-sizing:content){.temp-ends input{field-sizing:content;width:auto;min-width:2.5em}}
.temp-ends input:focus{outline:none;border-color:var(--blue);background:var(--sheet)}
.temp-scroll{overflow-x:auto;touch-action:pan-x}
.temp svg{display:block;height:auto;user-select:none;-webkit-user-select:none}
.temp .col{cursor:ns-resize;touch-action:none}
.temp .pt{cursor:ns-resize;outline:none;touch-action:none}
.temp .pt:focus-visible .ring{stroke:var(--blue);stroke-width:3;stroke-opacity:1}

/* ---------- Side panel ---------- */
.plot-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-items:start}
.plot-grid.with-side{grid-template-columns:minmax(0,1fr) 320px}
.side{position:sticky;top:calc(var(--barh,64px) + 12px);max-height:calc(100vh - var(--barh,64px) - 28px);overflow:auto;background:var(--sheet);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);display:flex;flex-direction:column;min-width:0}
.side-tabs{display:flex;align-items:center;gap:2px;padding:6px 8px 0;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--sheet);z-index:1}
.side-tabs button{border:0;background:transparent;padding:6px 10px;border-bottom:2px solid transparent;color:var(--ink-2);font-weight:500;display:inline-flex;align-items:center;gap:4px}
.side-tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.side-tabs .x{margin-left:auto;font-size:18px;border-bottom:0}
.side-body{padding:12px;display:flex;flex-direction:column;gap:12px}
@media (max-width:900px){
  .plot-grid.with-side{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;right:0;bottom:0;top:auto;max-height:62vh;border-radius:14px 14px 0 0;z-index:40;
    padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
}
.sc{display:grid;grid-template-columns:52px minmax(0,1fr);gap:10px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.sc:last-child{border-bottom:0}
.sc img,.sc .ph{width:52px;height:69px;border-radius:6px;object-fit:cover;background:var(--sheet-2);border-left:4px solid var(--cc);display:block}
.sc-name{font-weight:700}
.sc-role{font-size:11.5px;color:var(--ink-3);margin-left:6px;font-weight:500}
.sc dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:1px 8px;margin:4px 0 0;font-size:12.5px}
.sc dt{color:var(--ink-3)} .sc dd{margin:0;overflow-wrap:anywhere}
.sc p{margin:4px 0 0;font-size:12.5px;color:var(--ink-2);white-space:pre-wrap;overflow-wrap:anywhere}
.diff{background:var(--blue-soft);border-radius:8px;padding:8px 10px;font-size:12.5px;font-variant-numeric:tabular-nums;display:flex;flex-wrap:wrap;gap:2px 10px;align-items:baseline}
.diff b{font-size:16px}
.sn{border-bottom:1px solid var(--line);padding-bottom:10px}
.sn:last-child{border-bottom:0}
.sn h4{margin:0 0 2px;font-size:13.5px}
.sn p{margin:0;font-size:12.5px;white-space:pre-wrap;color:var(--ink-2);overflow-wrap:anywhere}
.fs-item{border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.fs-top{display:flex;align-items:center;gap:6px}
.fs-top input{flex:1;min-width:0;border:0;background:transparent;font-weight:700;padding:2px 4px;border-radius:5px}
.fs-top input:focus{outline:none;background:var(--sheet-2)}
.pill{font-size:11px;border-radius:999px;padding:1px 8px;white-space:nowrap;font-weight:700;background:var(--sheet-2);color:var(--ink-2)}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.bad{background:var(--red-soft);color:var(--red)} .pill.warn{background:var(--warn-soft);color:var(--s5)}
.fs-row{display:flex;gap:6px;font-size:12px;align-items:baseline;min-width:0}
.fs-row > span{color:var(--ink-3);flex:none;width:3em}
.fs-links{display:flex;flex-wrap:wrap;gap:4px;min-width:0}
.jump{border:1px solid var(--line);background:var(--sheet-2);border-radius:6px;font-size:12px;padding:1px 7px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}
.jump:hover{border-color:var(--ink-3)}
.fs-add{display:flex;gap:6px}
.fs-add input,.pop .row input{flex:1;min-width:0;height:30px;border:1px solid var(--line);border-radius:7px;background:var(--sheet-2);padding:0 8px}
.fs-tag{display:inline-flex;align-items:center;gap:4px;margin-top:6px;font-size:11.5px;border:1px solid var(--line);border-radius:999px;padding:1px 9px;background:var(--sheet-2);color:var(--ink-2);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fs-tag.set::before{content:"◇";color:var(--s5)}
.fs-tag.pay::before{content:"◆";color:var(--ok)}
.fs-opt{display:flex;align-items:center;gap:6px;padding:3px 10px}
.fs-opt span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fs-opt .btn.on{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.card.flash .bubble{animation:flash 1.6s ease}
@keyframes flash{0%,45%{box-shadow:0 0 0 4px var(--blue)}100%{box-shadow:0 0 0 0 transparent}}
.badge{background:var(--red);color:var(--sheet);border-radius:999px;font-size:10.5px;padding:0 6px;font-weight:700;line-height:1.5}
.tools .btn[aria-pressed="true"]{background:var(--ink);color:var(--sheet);border-color:var(--ink)}

/* ---------- Setting notes ---------- */
.notes-wrap{margin-top:30px}
.notes{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:12px}
.note{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow)}
.note-top{display:flex;gap:6px;align-items:center}
.note-top input{flex:1;min-width:0;font-weight:700;border:0;border-bottom:1px solid var(--line);background:transparent;padding:2px}
.note-top input:focus{outline:none;border-bottom-color:var(--blue)}
.note textarea{border:1px solid var(--line);border-radius:7px;background:var(--sheet-2);padding:6px 8px;min-height:96px;resize:vertical;line-height:1.6}
.note textarea:focus{outline:none;border-color:var(--blue)}
.add-note{border:2px dashed var(--line);border-radius:10px;background:transparent;min-height:120px;color:var(--ink-2);font-weight:500}
.add-note:hover{border-color:var(--ink-3);color:var(--ink)}

/* ---------- Touch devices (phones, tablets) ---------- */
@media (hover:none),(pointer:coarse){
  .mini{opacity:1;width:32px;height:32px;font-size:16px}
  .grip{width:32px;height:34px;font-size:14px}
  .card-tools{top:-18px}
  .card-tools .mini{width:34px;height:34px;font-size:16px}
  .card:hover .card-tools{opacity:0;pointer-events:none}
  .card.editing .card-tools,.card.menu-open .card-tools{opacity:1;pointer-events:auto}
  .sec{width:330px;flex-basis:330px}
  .sec-menu{width:36px;height:36px}
  .add-chip{height:34px;padding:0 12px;font-size:13px}
  .btn.sm{height:34px;padding:0 12px;font-size:13.5px}
  .sw{width:26px;height:26px}
  .thumb{width:52px;height:52px}
  .tools .hint{display:none}
  .pop button.item{padding:11px 12px}
  /* 16px stops iOS Safari from zooming in when a field gets focus */
  input,select,textarea,.t-serif textarea,.t-mono textarea,.t-nare textarea,.t-memo textarea,.fld input,.fld textarea,.big-ta{font-size:16px}
  .sec-pages input{width:52px;height:32px}
  .target input{height:34px}
}
@media (max-width:640px){
  /* header: one compact row + full-width tabs */
  .appbar{padding-block:8px}
  .bar-row{gap:6px}
  .logo-text{display:none}
  .proj{flex:1 1 0;order:1}
  .bar-actions{order:2;margin-left:0;gap:4px;flex-wrap:nowrap}
  .tabs{order:3;width:100%}
  .tabs button{flex:1;padding:5px 8px}
  .status{font-size:0;gap:0;width:14px;justify-content:center}
  #syncBtn{font-size:0;gap:0;width:34px;padding:0;justify-content:center}
  #themeBtn{display:none}
  #expMenuBtn{width:34px;padding:0;justify-content:center}
  #expMenuBtn .lbl{display:none}
  #expMenuBtn .ico{display:inline;font-size:17px}
  /* page header */
  main{padding-block:12px 80px}
  .banner{padding:8px 12px;font-size:12.5px;gap:6px 10px;margin-bottom:10px}
  .plot-head{margin-bottom:8px}
  .title-in{font-size:18px;flex-basis:100%}
  .stats{display:none}
  .budget{flex-wrap:nowrap;gap:8px;margin:0 0 10px}
  .bar{flex:1 1 60px}
  .budget-msg{font-size:12px;white-space:nowrap}
  /* tools: one scrollable line */
  .tools{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px));padding-bottom:2px}
  .tools::-webkit-scrollbar{display:none}
  .tools > *{flex:none}
  .temp{padding:8px 10px 2px}
  .temp-help{display:none}
  /* one section per screen, snapping */
  .board-scroll{scroll-snap-type:x proximity;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px))}
  .board.cols .sec{width:calc(100vw - 52px);flex-basis:calc(100vw - 52px);scroll-snap-align:center}
  .add-sec{width:min(200px,56vw);flex-basis:min(200px,56vw);scroll-snap-align:center}
  .board.rows .card{width:100%}
  .scenes{padding:2px 8px 6px}
  .cards{gap:8px}
  .sec-foot{padding:6px 8px 8px}
}
@media (min-width:641px) and (max-width:1100px){
  .chars{grid-template-columns:minmax(0,1fr)}
}

/* ---------- Export stage (print look, fixed light colors) ---------- */
#stage{position:absolute;left:-30000px;top:0;pointer-events:none}
.ex{background:var(--ex-bg);color:var(--ex-ink);font-family:var(--f-ui);font-size:14px;line-height:1.65;padding:44px 48px}
.ex-h{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;border-bottom:2px solid var(--ex-ink);padding-bottom:10px;margin-bottom:22px}
.ex-h h1{margin:0;font-size:26px;font-weight:700}
.ex-meta{font-size:12px;color:var(--ex-ink-2);text-align:right;font-variant-numeric:tabular-nums}
.ex-part{font-size:13px;letter-spacing:.2em;color:var(--ex-ink-2);margin:30px 0 12px;border-bottom:1px solid var(--ex-line);padding-bottom:4px}
.ex-sec-h{display:flex;align-items:baseline;gap:10px;margin:22px 0 10px;padding-left:10px;border-left:5px solid var(--hue)}
.ex-sec-h b{font-size:19px}
.ex-sec-h span{font-size:12px;color:var(--ex-ink-2)}
.ex-line{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;align-items:start;padding:5px 0}
.ex-who{font-size:12px;color:var(--ex-ink-2);padding-top:6px;text-align:right;overflow-wrap:anywhere}
.ex-who i{font-style:normal;display:block;font-size:10.5px;opacity:.8}
.ex-b{white-space:pre-wrap;overflow-wrap:anywhere}
.ex-b.serif{border:1.5px solid var(--ex-ink);border-radius:18px;padding:6px 14px;font-family:var(--f-type);font-size:15px}
.ex-b.mono{border:1.5px dashed var(--ex-ink-2);border-radius:9px;padding:6px 12px;font-family:var(--f-type);color:var(--ex-ink-2)}
.ex-b.nare{border:1.5px solid var(--ex-ink);padding:6px 12px;font-size:13.5px}
.ex-b.memo{background:var(--ex-memo);padding:6px 12px;font-size:13px;color:var(--ex-ink-2)}
.ex-board{display:flex;gap:16px;align-items:flex-start}
.ex-col{width:250px;flex:0 0 250px;border:1px solid var(--ex-line);border-top:5px solid var(--hue);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:9px;background:var(--ex-bg)}
.ex-col-h{display:flex;justify-content:space-between;align-items:baseline}
.ex-col-h b{font-size:17px}
.ex-col-h span{font-size:11.5px;color:var(--ex-ink-2)}
.ex-card .ex-who{text-align:left;padding:0 0 2px 4px}
.ex-chars{display:flex;flex-direction:column;gap:18px}
.ex-char{display:grid;grid-template-columns:190px minmax(0,1fr);gap:20px;border:1px solid var(--ex-line);border-top:5px solid var(--cc);border-radius:8px;padding:16px}
.ex-char-imgs{display:flex;flex-direction:column;gap:6px}
.ex-char-imgs .m{width:190px;height:253px;object-fit:cover;border-radius:6px;background:var(--ex-soft);display:block}
.ex-char-imgs .ph{width:190px;height:253px;border-radius:6px;background:var(--ex-soft);display:grid;place-items:center;font-size:12px;color:var(--ex-ink-2)}
.ex-char-imgs .ts{display:flex;flex-wrap:wrap;gap:5px}
.ex-char-imgs .ts img{width:44px;height:44px;object-fit:cover;border-radius:4px}
.ex-char h2{margin:0 0 2px;font-size:21px}
.ex-kana{font-size:12px;color:var(--ex-ink-2);margin-bottom:10px}
.ex-tbl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px 14px;margin-bottom:10px}
.ex-tbl div{font-size:13px;border-bottom:1px solid var(--ex-line);padding-bottom:3px}
.ex-tbl span{display:block;font-size:10.5px;color:var(--ex-ink-2)}
.ex-long{margin-top:8px}
.ex-long span{display:block;font-size:11px;color:var(--ex-ink-2);letter-spacing:.05em}
.ex-long p{margin:1px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.ex-temp{margin:4px 0 18px}
.ex-cap{font-size:12px;color:var(--ex-ink-2);margin-bottom:4px;letter-spacing:.05em}
.ex-temp img{display:block;max-width:100%;height:auto}
.ex-fs{display:grid;grid-template-columns:minmax(0,1fr);gap:6px}
.ex-fs-row{display:grid;grid-template-columns:180px 90px minmax(0,1fr);gap:10px;font-size:13px;border-bottom:1px solid var(--ex-line);padding:4px 0}
.ex-fs-row em{font-style:normal;font-weight:700}
.ex-fs-row small{display:block;color:var(--ex-ink-2);font-size:12px}
.ex-notes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.ex-note{border:1px solid var(--ex-line);border-radius:8px;padding:10px 14px}
.ex-note h3{margin:0 0 4px;font-size:15px}
.ex-note p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px}
.ex-who .fs{display:block;font-size:10.5px;color:var(--ex-ink-2)}
.ex-scene-h{font-size:13.5px;font-weight:700;margin:14px 0 4px;padding:2px 0 2px 10px;border-left:3px solid var(--hue);color:var(--ex-ink)}
.ex-col .ex-scene-h{margin:6px 0 0}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="appbar">
  <div class="bar-row">
    <div class="logo"><span class="logo-mark" aria-hidden="true">帖</span><span class="logo-text">プロット帖</span></div>
    <div class="proj">
      <label class="sr" for="projSel">作品を切り替え</label>
      <select id="projSel"></select>
      <button class="icon-btn" id="projMenuBtn" aria-label="作品のメニュー" title="作品のメニュー">⋯</button>
    </div>
    <div class="tabs" role="tablist" aria-label="表示">
      <button role="tab" id="tabPlot" aria-selected="true">プロット</button>
      <button role="tab" id="tabChars" aria-selected="false">キャラ・設定</button>
    </div>
    <div class="bar-actions">
      <span class="status" id="status" data-s="saved">保存済み</span>
      <button class="sync" id="syncBtn" data-s="off" hidden>ドライブにつなぐ</button>
      <button class="icon-btn" id="themeBtn" aria-label="表示の明るさ" title="表示の明るさ">◐</button>
      <button class="btn primary" id="expMenuBtn" aria-haspopup="menu" aria-label="書き出し"><span class="lbl">書き出し ▾</span><span class="ico" aria-hidden="true">⇩</span></button>
    </div>
  </div>
</header>

<main id="main">
  <div class="banner" id="sampleBanner" hidden>
    <span><b>サンプルです。</b>自由に書き換えて試せます。</span>
    <span class="sp"></span>
    <button class="btn sm" id="newFromSample">空のプロットを作る</button>
    <button class="btn sm ghost" id="hideSample">このまま使う</button>
  </div>

  <section id="plotView">
    <div class="plot-head">
      <label class="sr" for="projTitle">作品タイトル</label>
      <input class="title-in" id="projTitle" placeholder="作品タイトル">
      <div class="stats" id="stats"></div>
    </div>
    <div class="budget">
      <label class="target">全<input id="targetIn" type="number" min="0" inputmode="numeric" placeholder="—" aria-label="目標ページ数">P</label>
      <div class="bar" id="bar"></div>
      <span class="budget-msg" id="budgetMsg"></span>
    </div>
    <div class="tools">
      <div class="seg" role="group" aria-label="区切りの並べ方">
        <button id="layCols" aria-pressed="true">横に並べる</button>
        <button id="layRows" aria-pressed="false">縦に並べる</button>
      </div>
      <button class="btn sm" id="memoBtn" aria-pressed="false">ネタ帳 <span class="cnt" id="memoCount"></span></button>
      <button class="btn sm" id="bulkBtn">まとめて入力</button>
      <button class="btn sm" id="addSecBtn">＋ 区切りを追加</button>
      <button class="btn sm" id="selBtn" aria-pressed="false">選択</button>
      <button class="btn sm" id="tempBtn" aria-pressed="true">温度グラフ</button>
      <button class="btn sm" id="sideBtn" aria-pressed="false">資料を横に出す <span class="badge" id="sideBadge" hidden></span></button>
      <span class="hint">カードをつかんで並べ替え ／ 押すと編集 ／ Enterを2回で次のカード</span>
    </div>
    <div class="temp" id="tempPanel">
      <div class="temp-h"><input class="temp-title" id="tempTitle" aria-label="グラフの名前" placeholder="グラフの名前"><span class="temp-ends"><label for="tempHigh">10＝</label><input id="tempHigh" aria-label="10の意味" placeholder="高い"><label for="tempLow">0＝</label><input id="tempLow" aria-label="0の意味" placeholder="低い"></span><span class="hint temp-help">点を上下にドラッグして、シーンごとに0〜10を付けます。</span><span class="hint" id="tempPeak"></span></div>
      <div class="temp-scroll" id="tempWrap"></div>
    </div>
    <div class="plot-grid" id="plotGrid">
      <div class="board-scroll"><div class="board" id="board"></div></div>
      <aside class="side" id="side" aria-label="資料" hidden></aside>
    </div>
  </section>

  <section id="charView" hidden>
    <div class="char-head">
      <h2>キャラ</h2>
      <button class="btn sm" id="addCharBtn">＋ キャラを追加</button>
      <span class="hint">画像はドラッグ&ドロップでも追加できます</span>
    </div>
    <div class="chars" id="chars"></div>
    <div class="notes-wrap">
      <div class="char-head">
        <h2>作品の設定</h2>
        <button class="btn sm" id="addNoteBtn">＋ 設定を追加</button>
        <span class="hint">能力の決まりごと、世界観、舞台、関係の前提など</span>
      </div>
      <div class="notes" id="notes"></div>
    </div>
  </section>
</main>

<input type="file" id="imgInput" accept="image/*" multiple hidden>
<input type="file" id="jsonInput" accept=".json,application/json" hidden>
<div id="stage" aria-hidden="true"></div>

<script>
(() => {
'use strict';
/* ================= constants ================= */
const LS_KEY='plotcho.v1', LS_CUR='plotcho.cur', LS_UNS='plotcho.unsynced', LS_TXT='plotcho.txtopt', LS_EXP='plotcho.expopt', LS_TAB='plotcho.tab', LS_SIDE='plotcho.side', LS_SIDETAB='plotcho.sidetab', LS_TEMPV='plotcho.temp';
const TYPES=[['serif','セリフ'],['mono','モノローグ'],['nare','ナレーション'],['memo','ト書き・メモ']];
const TYPE_LABEL=Object.fromEntries(TYPES);
const HUES=[['s1','青'],['s2','緑'],['s3','赤'],['s4','紫'],['s5','黄'],['s6','灰']];
const KCOL=['k1','k2','k3','k4','k5','k6'];
const FIELDS=[['kana','よみ'],['role','立ち位置'],['age','年齢'],['height','身長'],['first','一人称'],['call','相手の呼び方']];
const LONG=[['personality','性格'],['look','外見'],['bg','設定・背景'],['memo','メモ']];
const EXC={s1:'#2A66C9',s2:'#2E8A5E',s3:'#C8402F',s4:'#7650C2',s5:'#BC820F',s6:'#6A7385',k1:'#2A66C9',k2:'#C8402F',k3:'#2E8A5E',k4:'#7650C2',k5:'#BC820F',k6:'#C94E8A'};
const REDUCED=matchMedia('(prefers-reduced-motion: reduce)').matches;
const CLIENT='w'+Math.random().toString(36).slice(2,9);

/* ================= helpers ================= */
const $=(s,r=document)=>r.querySelector(s);
const rid=(p='')=>p+Date.now().toString(36).slice(-6)+Math.random().toString(36).slice(2,7);
const clone=o=>JSON.parse(JSON.stringify(o));
function lsGet(k){try{const v=localStorage.getItem(k);return v?JSON.parse(v):null}catch{return null}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch{return false}}
const PROPS=new Set(['value','checked','disabled','selected','hidden','multiple']);
function h(tag,props,...kids){
  const el=document.createElement(tag);
  if(props) for(const [k,v] of Object.entries(props)){
    if(v==null||v===false) continue;
    if(k==='class') el.className=v;
    else if(k==='style') el.style.cssText=v;
    else if(k==='dataset') Object.assign(el.dataset,v);
    else if(k.startsWith('on')&&typeof v==='function') el.addEventListener(k.slice(2),v);
    else if(PROPS.has(k)) el[k]=v;
    else el.setAttribute(k,v===true?'':String(v));
  }
  for(const c of kids.flat(Infinity)){ if(c==null||c===false) continue; el.append(c instanceof Node?c:document.createTextNode(String(c))); }
  return el;
}
function autosize(t){ t.style.height='auto'; t.style.height=t.scrollHeight+'px'; }
function safeName(s){ return (s||'プロット').replace(/[\\/:*?"<>|\n\r]/g,'_').trim().slice(0,80)||'プロット'; }
function today(){ const d=new Date(); return d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0'); }
function byteSize(o){ return new Blob([JSON.stringify(o)]).size; }

/* ================= data ================= */
function normalize(p){
  p.title=String(p.title??'無題のプロット'); p.layout=p.layout==='rows'?'rows':'cols';
  p.sections=Array.isArray(p.sections)?p.sections:[]; p.chars=Array.isArray(p.chars)?p.chars:[];
  p.target=Math.max(0,Math.round(Number(p.target)||0));
  p.foreshadows=(Array.isArray(p.foreshadows)?p.foreshadows:[]).filter(f=>f&&f.id).map(f=>({id:String(f.id),name:String(f.name??'')}));
  const fsIds=new Set(p.foreshadows.map(f=>f.id));
  const clampT=v=>(v==null||v===''||isNaN(Number(v)))?null:Math.max(0,Math.min(10,Math.round(Number(v))));
  p.tempTitle=p.tempTitle==null?'二人の距離感':String(p.tempTitle);
  p.tempHigh=p.tempHigh==null?'近い':String(p.tempHigh);
  p.tempLow=p.tempLow==null?'遠い':String(p.tempLow);
  p.inbox=(Array.isArray(p.inbox)?p.inbox:[]).filter(Boolean).map(c=>({...c,id:c.id||rid('k'),type:TYPE_LABEL[c.type]?c.type:'memo',speaker:String(c.speaker||''),text:String(c.text??''),
    fs:(c.fs&&fsIds.has(c.fs.id)&&(c.fs.role==='set'||c.fs.role==='pay'))?{id:c.fs.id,role:c.fs.role}:null,createdAt:Number(c.createdAt)||0}));
  p.notes=(Array.isArray(p.notes)?p.notes:[]).filter(Boolean).map(n=>({id:n.id||rid('n'),title:String(n.title??''),body:String(n.body??'')}));
  for(const s of p.sections){
    const oldTemp=clampT(s.temp); delete s.temp;
    s.id=s.id||rid('s'); s.title=String(s.title??''); s.pages=Math.max(0,Number(s.pages)||0);
    s.hue=HUES.some(x=>x[0]===s.hue)?s.hue:'s6';
    // 以前のデータ（区切りの中に直接カード）は、名前なしのシーン1つにまとめる
    if(!Array.isArray(s.scenes)) s.scenes=[{id:rid('m'),title:'',cards:Array.isArray(s.cards)?s.cards:[]}];
    delete s.cards;
    s.scenes=s.scenes.filter(Boolean).map(n=>({id:n.id||rid('m'),title:String(n.title??''),collapsed:!!n.collapsed,temp:clampT(n.temp),cards:Array.isArray(n.cards)?n.cards:[]}));
    // 以前の「区切りごとの距離感」は、その区切りのシーン全部に引き継ぐ
    if(oldTemp!=null&&s.scenes.every(n=>n.temp==null)) s.scenes.forEach(n=>n.temp=oldTemp);
    if(!s.scenes.length) s.scenes.push(newScene());
    for(const n of s.scenes) for(const c of n.cards){ c.id=c.id||rid('k'); c.type=TYPE_LABEL[c.type]?c.type:'serif'; c.speaker=String(c.speaker||''); c.text=String(c.text??'');
      c.fs=(c.fs&&fsIds.has(c.fs.id)&&(c.fs.role==='set'||c.fs.role==='pay'))?{id:c.fs.id,role:c.fs.role}:null; }
  }
  for(const c of p.chars){
    c.id=c.id||rid('c'); c.name=String(c.name??''); c.color=KCOL.includes(c.color)?c.color:'k1';
    c.images=Array.isArray(c.images)?c.images.filter(i=>i&&(i.a||i.d)):[];
    for(const [k] of [...FIELDS,...LONG]) c[k]=String(c[k]??'');
  }
  p.createdAt=Number(p.createdAt)||Date.now(); p.updatedAt=Number(p.updatedAt)||0; p.sample=!!p.sample;
  return p;
}
function newScene(title=''){ return {id:rid('m'),title,collapsed:false,temp:null,cards:[]}; }
const allCards=s=>s.scenes.flatMap(n=>n.cards);
function blankProject(title='無題のプロット'){
  return normalize({id:rid('p'),title,layout:'cols',createdAt:Date.now(),chars:[],
    sections:[['起','s1'],['承','s2'],['転','s3'],['結','s4']].map(([t,hue])=>({id:rid('s'),title:t,hue,pages:0,cards:[]}))});
}
function sampleProject(){
  const a=rid('c'),b=rid('c');
  const k=(type,text,speaker='',fs=null)=>({id:rid('k'),type,speaker,text,fs});
  const sc=(title,temp,...cards)=>({id:rid('m'),title,temp,cards});
  const f1=rid('f'),f2=rid('f');
  return normalize({id:rid('p'),title:'雨宿りの花屋（サンプル）',sample:true,layout:'cols',createdAt:Date.now(),target:32,
    foreshadows:[{id:f1,name:'買った花の行方'},{id:f2,name:'金曜の花言葉'}],
    notes:[{id:rid('n'),title:'舞台',body:'駅前商店街のはずれ。花屋「あさひな生花店」と、久世の勤める工務店が通りをはさんで向かい合っている。'},
           {id:rid('n'),title:'金曜の花',body:'久世が毎週買う花は毎回ちがう。花言葉を順に並べると告白になっている、という仕掛けにするか検討中。'}],
    chars:[
      {id:a,name:'久世 蓮司',kana:'くぜ れんじ',role:'攻め',age:'29',height:'186cm',first:'俺',call:'あんた',color:'k1',
       personality:'無口で不器用。一度決めたことは曲げない。',look:'黒髪の短髪。長身で肩幅が広く、手が大きい。作業着姿が多い。',
       bg:'花屋の向かいにある工務店の大工。毎週金曜の閉店間際に、花を一本だけ買っていく。',memo:'',images:[]},
      {id:b,name:'朝比奈 湊',kana:'あさひな みなと',role:'受け',age:'26',height:'168cm',first:'僕',call:'久世さん',color:'k2',
       personality:'人当たりがよく世話焼き。自分のことは後回しにしがち。',look:'色素の薄い柔らかい髪。生成りのエプロン。',
       bg:'祖母から継いだ「あさひな生花店」を一人で切り盛りしている。',memo:'',images:[]}
    ],
    sections:[
      {id:rid('s'),title:'起',hue:'s1',pages:6,scenes:[
        sc('金曜、閉店間際の花屋',1,
          k('nare','駅前商店街のはずれにある、小さな花屋。'),
          k('memo','金曜、閉店間際。外は雨。'),
          k('serif','いらっしゃいませ。今日も一本ですか？',b),
          k('serif','……ああ。',a)),
        sc('湊の気がかり',2,
          k('mono','毎週同じ時間に来て、毎回ちがう花を一本だけ。\n誰に渡してるんだろう。',b,{id:f1,role:'set'}))]},
      {id:rid('s'),title:'承',hue:'s2',pages:8,scenes:[
        sc('雨宿り',4,
          k('memo','雨が強くなり、久世は店先で雨宿りすることに。'),
          k('serif','よかったら中で待っててください。お茶いれますから。',b),
          k('serif','……悪い。',a),
          k('mono','近くで見ると、思っていたより手が大きい。',b)),
        sc('花言葉の話',5,
          k('memo','湊、祖母に教わった花言葉の話をする。久世は黙って聞いている。','',{id:f2,role:'set'}))]},
      {id:rid('s'),title:'転',hue:'s3',pages:10,scenes:[
        sc('向かいの窓辺',6,
          k('memo','閉店後、湊は向かいの工務店の窓辺に、自分が売った花がずらりと並んでいるのを見つける。','',{id:f1,role:'pay'})),
        sc('告白',9,
          k('serif','これ、全部……誰かに渡してたんじゃないんですか？',b),
          k('serif','渡せなかった。\n……あんたに渡したかったんだ。',a))]},
      {id:rid('s'),title:'結',hue:'s4',pages:8,scenes:[
        sc('最初の金曜日',10,
          k('memo','付き合いはじめて最初の金曜日。'),
          k('serif','今日は二本くれ。',a),
          k('serif','二本？',b),
          k('serif','一本はあんたの分だ。',a),
          k('mono','この人、こんなふうに笑うんだ。',b))]}
    ]});
}

/* ================= state ================= */
let projects={}, cur=null, tab=lsGet(LS_TAB)==='chars'?'chars':'plot';
const downloads=true;
const LS_TOMB='plotcho.deleted';
const dirty=new Set(); let saving=false, again=false, saveTimer=null, pendingRender=false;
let sortables=[]; let lastUndo=null;
let sideOpen=!!lsGet(LS_SIDE), sideTab=['memo','chars','notes','fs'].includes(lsGet(LS_SIDETAB))?lsGet(LS_SIDETAB):'memo', showTemp=(v=>v==null?!matchMedia('(max-width:640px)').matches:v!==false)(lsGet(LS_TEMPV));

function P(){ return projects[cur]; }
function firstId(){ return Object.values(projects).sort((a,b)=>a.createdAt-b.createdAt)[0]?.id||null; }
function charById(id){ return P().chars.find(c=>c.id===id); }
/* ---------- storage: IndexedDB on this device ---------- */
const IDB={
  db:null,
  open(){ return this.db||(this.db=new Promise((res,rej)=>{ const r=indexedDB.open('plotcho',1);
    r.onupgradeneeded=()=>{ if(!r.result.objectStoreNames.contains('projects')) r.result.createObjectStore('projects',{keyPath:'id'}); };
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); })); },
  async tx(mode,fn){ const d=await this.open(); return new Promise((res,rej)=>{ const t=d.transaction('projects',mode); const out=fn(t.objectStore('projects')); t.oncomplete=()=>res(out&&out.result!==undefined?out.result:undefined); t.onerror=()=>rej(t.error); t.onabort=()=>rej(t.error); }); },
  all(){ return this.tx('readonly',st=>st.getAll()); },
  put(list){ return this.tx('readwrite',st=>{ list.forEach(p=>st.put(clone(p))); }); },
  del(id){ return this.tx('readwrite',st=>{ st.delete(id); }); }
};
async function loadLocal(){
  let list=[];
  try{ list=await IDB.all()||[]; }catch(e){ console.warn(e); toast('この端末に保存できない設定になっています。プライベートブラウズを使っていないか確認してください。'); }
  for(const p of list) if(p&&Array.isArray(p.sections)) projects[p.id]=normalize(p);
  if(!Object.keys(projects).length){ const s=sampleProject(); projects[s.id]=s; IDB.put([s]).catch(()=>{}); }
  const c=lsGet(LS_CUR); cur=projects[c]?c:firstId();
}
function saveLocal(){ lsSet(LS_CUR,cur); return true; }
function touch(p=P()){
  if(!p) return;
  p.updatedAt=Date.now(); dirty.add(p.id);

}
function scheduleSave(){ clearTimeout(saveTimer); setStatus('saving'); saveTimer=setTimeout(flush,600); }
function setStatus(s){
  const el=$('#status'); el.dataset.s=s;
  el.textContent= s==='saving'?'保存中…' : s==='error'?'保存できませんでした' : '保存済み';
}
async function flush(){
  clearTimeout(saveTimer);
  if(saving){ again=true; return; }
  saving=true; let failed=false;
  try{
    const ids=[...dirty]; dirty.clear();
    const list=ids.map(id=>projects[id]).filter(Boolean);
    if(list.length){
      try{ await IDB.put(list); }
      catch(e){ ids.forEach(id=>dirty.add(id)); failed=true; console.warn(e);
        toast('この端末に保存できませんでした。空き容量が少ないか、画像が多すぎる可能性があります。'); }
    }
    saveLocal();
  }finally{
    saving=false; setStatus(failed?'error':(dirty.size?'saving':'saved'));
    if(again){ again=false; flush(); }
  }
}

/* ---------- Google Drive sync ---------- */
const Drive=window.PlotDrive;
let syncing=false, syncAgain=false, syncTimer=null, syncState='off', lastSync=0;
function syncOn(){ return !!(Drive&&Drive.enabled()); }
function setSync(s,msg){
  syncState=s; const b=$('#syncBtn'); if(!b) return;
  b.hidden=!syncOn(); b.dataset.s=s;
  const t=lastSync?new Date(lastSync):null; const hm=t?`${t.getHours()}:${String(t.getMinutes()).padStart(2,'0')}`:'';
  b.textContent= s==='off'?'ドライブにつなぐ' : s==='need'?'再接続' : s==='syncing'?'同期中…' : s==='error'?'同期できませんでした' : `同期済み ${hm}`;
  b.title= msg || (s==='ok'?'押すと今すぐ同期します':s==='need'?'ログインの期限が切れました。押すとつなぎ直します':s==='error'?'押すともう一度同期します':'Googleドライブで端末どうしを同期します');
}
function scheduleSync(){ if(!syncOn()||!Drive.hasToken()) return; clearTimeout(syncTimer); syncTimer=setTimeout(()=>syncNow(false),4000); }
async function syncNow(interactive){
  if(!syncOn()) return;
  if(!Drive.hasToken()){
    if(!interactive){ setSync(Drive.everConnected()?'need':'off'); return; }
    try{ await Drive.signIn(); }catch(e){ setSync(Drive.everConnected()?'need':'off'); toast(e.message||'ログインできませんでした'); return; }
  }
  if(syncing){ syncAgain=true; return; }
  syncing=true; clearTimeout(syncTimer); setSync('syncing');
  try{
    await flush();
    const files=await Drive.list(); const remote={};
    for(const f of files){ const pid=(f.appProperties&&f.appProperties.pid)||f.name.replace(/^plotcho-|\.json$/g,''); if(pid) remote[pid]=f; }
    // deletions made on this device
    const tomb=lsGet(LS_TOMB)||{};
    for(const pid of Object.keys(tomb)){ if(remote[pid]){ await Drive.remove(remote[pid].id); delete remote[pid]; } delete tomb[pid]; }
    lsSet(LS_TOMB,tomb);
    let changed=false; const save=[];
    for(const [pid,f] of Object.entries(remote)){
      const rUp=Number(f.appProperties&&f.appProperties.updatedAt)||Date.parse(f.modifiedTime)||0;
      const lp=projects[pid];
      const base=lp?(lp.syncedAt||0):0;
      const localChanged=!!lp&&(lp.updatedAt>base||dirty.has(pid));
      const remoteChanged=rUp>base;
      // 片方だけ変わっていればそちらを採用。両方変わっていたら、あとで保存したほうを残す
      const takeRemote=!lp||(remoteChanged&&(!localChanged||rUp>lp.updatedAt));
      if(takeRemote&&!dirty.has(pid)){
        const data=await Drive.download(f.id);
        if(!data||!Array.isArray(data.sections)) continue;
        const np=normalize({...data,id:pid}); np.updatedAt=rUp; np.remoteId=f.id; np.syncedAt=rUp;
        projects[pid]=np; save.push(np); changed=true;
      }else if(localChanged){
        const at=lp.updatedAt; const r=await Drive.upload(lp,f.id); lp.remoteId=r.id; lp.syncedAt=at; save.push(lp);
      }else if(lp&&lp.remoteId!==f.id){ lp.remoteId=f.id; save.push(lp); }
    }
    const hasRemote=Object.keys(remote).length>0;
    for(const lp of Object.values(projects)){
      if(remote[lp.id]) continue;
      if(lp.sample&&!lp.updatedAt){ if(hasRemote){ delete projects[lp.id]; await IDB.del(lp.id); changed=true; } continue; }
      if(lp.remoteId&&lp.syncedAt&&lp.updatedAt<=lp.syncedAt){ delete projects[lp.id]; await IDB.del(lp.id); changed=true; continue; } // deleted on another device
      const at=lp.updatedAt; const r=await Drive.upload(lp,null); lp.remoteId=r.id; lp.syncedAt=at; save.push(lp);
    }
    if(save.length) await IDB.put(save);
    lastSync=Date.now(); setSync('ok');
    if(changed){ if(!projects[cur]) cur=firstId(); safeRender(); }
  }catch(e){
    console.warn(e);
    if(e&&e.auth) setSync('need'); else { setSync('error',e&&e.message); }
  }finally{
    syncing=false;
    if(syncAgain){ syncAgain=false; syncNow(false); }
  }
}
function syncMenu(anchor){
  popover(anchor,close=>[
    h('button',{class:'item',onclick:()=>{ close(); syncNow(true); }},Drive.hasToken()?'今すぐ同期':'つなぐ'),
    Drive.hasToken()?h('button',{class:'item danger',onclick:()=>{ close(); Drive.signOut(); setSync('off'); toast('ドライブとの接続を切りました。データはこの端末に残っています'); }},'ドライブとの接続を切る'):null

}

/* ---------- ドラッグ中の自動スクロール(画面の端に近いほど速く。指を止めていても流れる) ---------- */
const autoScroll=(()=>{
  let on=false, raf=0, x=-1, y=-1, last=0;
  const sc=()=>board.closest('.board-scroll');
  let moved=false;
  const track=e=>{ const t=e.touches?e.touches[0]:e; if(t){ x=t.clientX; y=t.clientY; moved=true; } };
  const speed=(d,zone)=>{ const r=Math.min(1,Math.max(0,d/zone)); return r<=0?0:(2+r*r*26); }; // px/16ms
  function tick(now){
    if(!on) return;
    const dt=Math.min(48,now-(last||now)); last=now; const k=dt/16;
    // 動いたらすぐ並べ替え先を判定する(Sortableは標準だと50msごと)
    if(moved){ moved=false; try{ window.Sortable&&Sortable.active&&Sortable.active._emulateDragOver&&Sortable.active._emulateDragOver(); }catch{} }
    if(x>=0){
      const box=sc(); const r=box.getBoundingClientRect();
      const zx=Math.min(90,innerWidth*.16), zy=Math.min(110,innerHeight*.14);
      const top=(parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--barh'))||60)+4;
      let dx=0, dy=0;
      const L=Math.max(r.left,0), R=Math.min(r.right,innerWidth);
      // 横は、ボードの上にいるときだけ(横の資料パネルへ動かすときは流さない)
      if(x>=L&&x<=R){ if(x<L+zx) dx=-speed(L+zx-x,zx); else if(x>R-zx) dx=speed(x-(R-zx),zx); }
      if(y<top+zy) dy=-speed(top+zy-y,zy); else if(y>innerHeight-zy) dy=speed(y-(innerHeight-zy),zy);
      if(dx) box.scrollLeft+=dx*k;
      if(dy) window.scrollBy(0,dy*k);
    }
    raf=requestAnimationFrame(tick);
  }
  return {
    start(e){
      const oe=e&&e.originalEvent; if(oe) track(oe);
      if(on) return; on=true; last=0;
      sc().classList.add('nosnap');
      addEventListener('pointermove',track,{passive:true}); addEventListener('touchmove',track,{passive:true}); addEventListener('mousemove',track,{passive:true});
      raf=requestAnimationFrame(tick);
    },
    stop(){
      on=false; cancelAnimationFrame(raf); x=y=-1;
      removeEventListener('pointermove',track); removeEventListener('touchmove',track); removeEventListener('mousemove',track);
      setTimeout(()=>sc().classList.remove('nosnap'),400);
    }
  };
})();

let multiCount=0, multiOrder=[];
const flatIds=()=>P().sections.flatMap(s=>s.scenes.flatMap(n=>n.cards.map(c=>c.id)));
function multiStart(item){
  multiCount=0; multiOrder=[];
  if(!item.classList.contains('card')||!selected.has(item.dataset.id)||selected.size<2) return;
  multiOrder=flatIds().filter(id=>selected.has(id)); multiCount=multiOrder.length;
  board.querySelectorAll('.card.selected').forEach(el=>{ if(el!==item) el.classList.add('multi-ghost'); });
}
function multiEnd(item){
  if(multiCount<2){ multiCount=0; return; }
  const i=multiOrder.indexOf(item.dataset.id);
  const el=id=>board.querySelector(`.card[data-id="${id}"]`);
  multiOrder.slice(0,i).forEach(id=>{ const e=el(id); if(e) item.before(e); });
  multiOrder.slice(i+1).reverse().forEach(id=>{ const e=el(id); if(e) item.after(e); });
  board.querySelectorAll('.multi-ghost').forEach(e=>e.classList.remove('multi-ghost'));
  multiCount=0;
}
